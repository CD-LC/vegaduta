# LOCK INPUT ONLY - not a package, never `pip install` this directory.
#
# services/lock-requirements.sh compiles sidecar/requirements.lock from THIS
# file plus ../requirements.txt. It exists for one reason: torch must come
# from PyPI's CPU-only mirror (https://download.pytorch.org/whl/cpu - see
# ../Dockerfile for why), and uv can only scope an index to ONE package via
# [tool.uv.sources], which lives in a pyproject. Passing the CPU index as a
# plain --extra-index-url instead lets it serve every package it also
# mirrors (markupsafe, numpy, ...), and the lock then records the mirror's
# subset of wheel hashes - an image build that picks PyPI's wheel fails
# --require-hashes. With `explicit = true` the index is consulted for torch
# and nothing else; every other hash comes from PyPI.
#
# To bump torch: change the version here (keep the +cpu local version),
# rerun services/lock-requirements.sh sidecar.
[project]
name = "sidecar-lock-input"
version = "0"
requires-python = ">=3.12"
dependencies = ["torch==2.14.0+cpu"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
