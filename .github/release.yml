# Categories for auto-generated release notes (`gh release create
# --generate-notes`, used by release.yml when CHANGELOG.md has no section for
# the version). Labels come from .github/labeler.yml and the issue templates.
changelog:
  exclude:
    labels: [skip-changelog]
    authors: [dependabot]
  categories:
    - title: Breaking changes
      labels: [breaking-change]
    - title: Security
      labels: [security]
    - title: Features
      labels: [enhancement]
    - title: Bug fixes
      labels: [bug]
    - title: Database migrations
      labels: [area/migrations]
    - title: Documentation
      labels: [documentation]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
