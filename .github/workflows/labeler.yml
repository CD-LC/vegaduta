name: Labeler

# Labels pull requests by the paths they touch (.github/labeler.yml).
# pull_request_target so fork PRs can be labeled too. This workflow never
# checks out or runs code from the pull request, which is what keeps
# pull_request_target safe here; do not add a checkout of the PR head.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # read .github/labeler.yml from the base branch
      pull-requests: write # add labels to the pull request
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: false
