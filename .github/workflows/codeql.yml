name: CodeQL

# SAST for the three languages in the tree: Java (core/), TypeScript/JavaScript
# (web/, Node services) and Python (services/). All three use
# build-mode "none": CodeQL extracts Java without running Maven, so a broken or
# slow reactor build cannot make the security scan fail.
#
# No workflow-level paths-ignore: a required check that never reports leaves
# docs-only pull requests stuck at "Expected - waiting", and build-mode none is
# cheap. Test, tooling and sample code is excluded from the analysis itself by
# .github/codeql/codeql-config.yml (the check still runs on every PR). The
# `CodeQL OK` job aggregates the language matrix into one stable check name
# for branch protection (docs/maintainers/branch-protection.md).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "27 4 * * 1" # weekly, Monday 04:27 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Code scanning needs a public repository or GitHub Advanced Security; on a
  # private repository without it the upload fails ("Advanced Security must be
  # enabled"). Checked through the API rather than github.event.repository,
  # which scheduled runs do not carry. With Advanced Security on a private
  # repository, set the repository variable ADVANCED_SECURITY=true.
  enabled:
    name: Code scanning available
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # read the repository's visibility
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ADVANCED_SECURITY: ${{ vars.ADVANCED_SECURITY }}
        run: |
          visibility="$(gh api "repos/$REPO" --jq .visibility)"
          if [ "$visibility" = public ] || [ "$ADVANCED_SECURITY" = true ]; then
            echo "enabled=true" >>"$GITHUB_OUTPUT"
          else
            echo "enabled=false" >>"$GITHUB_OUTPUT"
            echo "::notice::CodeQL skipped: $visibility repository without Advanced Security (set ADVANCED_SECURITY=true if it is on)"
          fi

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: enabled
    if: needs.enabled.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read # check out the repository
      actions: read # read workflow run metadata for the upload
      security-events: write # upload results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"

  codeql-ok:
    name: CodeQL OK
    if: always()
    needs: [enabled, analyze]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check analysis results
        env:
          GATE: ${{ needs.enabled.result }}
          ENABLED: ${{ needs.enabled.outputs.enabled }}
          RESULT: ${{ needs.analyze.result }}
        run: |
          echo "enabled: $GATE ($ENABLED); analyze: $RESULT"
          [ "$GATE" = success ] || { echo "::error::visibility check did not succeed ($GATE)"; exit 1; }
          if [ "$ENABLED" != true ]; then echo "CodeQL skipped: code scanning not available"; exit 0; fi
          [ "$RESULT" = success ] || { echo "::error::CodeQL analysis did not succeed ($RESULT)"; exit 1; }
