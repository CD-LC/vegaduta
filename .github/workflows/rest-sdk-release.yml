name: REST SDK release

# Releases the generated REST clients - sdk/typescript (npm `vegaduta-sdk`) and
# sdk/python (PyPI `vegaduta-sdk`) - for a tag `restsdk-v1.2.3` (or -rc.1).
# Run it from the Actions tab with "Use workflow from" set to that TAG; a branch
# is refused. It is independent of the platform release and of the agent SDKs
# (sdk-v* and pysdk-v* tags). Both packages share the tag version; their
# manifests must be bumped together.
# Procedure and one-time setup: docs/maintainers/releasing-rest-sdks.md.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rest-sdk-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  TYPESCRIPT_VERSION: "5.9.3"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Require a tag ref
        run: |
          case "$GITHUB_REF" in
            refs/tags/restsdk-v*) ;;
            *) echo "::error::run this workflow on a restsdk-v* tag (Use workflow from: Tags), not $GITHUB_REF"; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Tag must equal both manifest versions
        id: version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#restsdk-v}"
          ts_version="$(node -e "console.log(require('./sdk/typescript/package.json').version)")"
          py_version="$(python3 -c 'import re,sys; print(re.search(r"^version = \"(.+)\"", open("sdk/python/pyproject.toml").read(), re.M).group(1))')"
          py_dunder="$(python3 -c 'import re,sys; print(re.search(r"__version__ = \"(.+)\"", open("sdk/python/vegaduta_sdk/__init__.py").read()).group(1))')"
          for v in "$ts_version" "$py_version" "$py_dunder"; do
            if [ "$v" != "$tag_version" ]; then
              echo "::error::tag $GITHUB_REF_NAME but manifests say typescript=$ts_version python=$py_version dunder=$py_dunder"; exit 1
            fi
          done
          case "$tag_version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"
      - name: Generated sources are in sync with the spec
        run: node sdk/generate.mjs --check
      - name: Type-check and build the TypeScript package
        working-directory: sdk/typescript
        run: |
          npm ci || npm install --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Run runtime and contract tests
        run: |
          node --test sdk/test/ts-runtime.test.mjs
          node --test sdk/test/generate.test.mjs
          node --test sdk/test/consumer-contract.test.mjs
          python3 -m unittest discover -s sdk/python/tests -v

  build:
    name: Build distributions
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # sign the provenance attestation
      attestations: write # store it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Typecheck, build and pack the TypeScript package
        working-directory: sdk/typescript
        run: |
          set -euo pipefail
          npm ci || npm install --no-audit --no-fund
          # package.json says "private": true so nothing publishes it from a checkout by accident. The
          # tarball built here is what the GitHub release carries and what the npm job publishes, so
          # the flag goes before it is packed (`npm publish` refuses a private manifest, also in a tarball).
          npm pkg delete private
          npm pack  # prepack: typecheck + build, so dist/ is in the tarball
          # List once, then grep the file: under `set -o pipefail`, `tar | grep -q` can
          # fail on tar's SIGPIPE after grep matched and exited - a false "missing file".
          tar -tzf vegaduta-sdk-*.tgz > tarball-files.txt
          for f in package/dist/index.js package/dist/index.d.ts package/LICENSE package/package.json; do
            grep -qx "$f" tarball-files.txt || { echo "::error::the packed tarball has no $f"; exit 1; }
          done
          mv vegaduta-sdk-*.tgz ../.. --verbose
      - name: Build the Python package
        run: |
          python3 -m pip install --user build
          python3 -m build sdk/python --outdir dist
      - name: Checksums
        run: |
          cd dist && sha256sum *.tar.gz *.whl ../vegaduta-sdk-*.tgz > SHA256SUMS 2>/dev/null || \
          ( sha256sum *.tar.gz *.whl > SHA256SUMS && sha256sum ../vegaduta-sdk-*.tgz >> SHA256SUMS )
      - name: Attest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/
            vegaduta-sdk-*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rest-sdk-dists
          path: |
            dist/
            vegaduta-sdk-*.tgz
          retention-days: 30

  release:
    name: GitHub release
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rest-sdk-dists
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=(--repo "$GITHUB_REPOSITORY")
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          # No checkout in this job, so no git: --verify-tag/--generate-notes make gh
          # shell out to git and fail. Point every call at the repo explicitly.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* vegaduta-sdk-*.tgz --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* vegaduta-sdk-*.tgz \
              --title "REST client SDKs ${{ needs.verify.outputs.version }}" \
              --notes "TypeScript (npm) and Python (PyPI) REST clients ${{ needs.verify.outputs.version }}, generated from docs/api/openapi.json. Verify with \`sha256sum -c SHA256SUMS\` and \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`." \
              "${flags[@]}"
          fi

  pypi:
    name: Publish to PyPI
    if: vars.SDK_PUBLISH_PYPI == 'true'
    environment: pypi-rest-sdk
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rest-sdk-dists
          path: dist
      # SHA256SUMS ships on the GitHub Release but is not a distribution file - twine
      # (and the check this action runs first) rejects it in packages-dir.
      - run: rm -f dist/SHA256SUMS
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true
          packages-dir: dist

  npm:
    name: Publish to npm
    if: vars.SDK_PUBLISH_NPM == 'true'
    environment: npm
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # npm provenance
      contents: read
    steps:
      # The tarball the build job packed, attested and attached to the GitHub release. A fresh checkout
      # has no dist/ (it is gitignored and `--ignore-scripts` skips the build), so publishing the source
      # tree would ship a package whose `main` and `types` point at files that are not there.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rest-sdk-dists
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Publish the attested tarball to npm (provenance)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          tarball="$(ls vegaduta-sdk-*.tgz)"
          case "$tarball" in *$'\n'*) echo "::error::more than one vegaduta-sdk tarball: $tarball"; exit 1 ;; esac
          tar -tzf "$tarball" | grep -qx 'package/dist/index.js' \
            || { echo "::error::$tarball has no dist/index.js; refusing to publish an empty package"; exit 1; }
          npm publish "./$tarball" --provenance --access public
