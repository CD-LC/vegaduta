name: Docs site

# Builds the documentation site from docs/ (mkdocs.yml) and publishes it to
# GitHub Pages. A run from the Actions tab builds with `mkdocs build --strict`
# (a broken link or snippet fails it) and, when Pages is enabled, deploys.
#
# One-time setup (docs/maintainers/docs-site.md): in the repository settings set
# Pages -> Build and deployment -> Source to "GitHub Actions", then set the
# repository variable DOCS_PUBLISH_PAGES to "true". Until then the build still
# runs (so a broken page is caught) and the deploy job is skipped, so main never
# shows a failed run just because Pages is not enabled yet.

# Runs on doc-affecting changes and on demand. `make docs-build` runs the same
# strict build locally.
on:
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - sdk/README.md
      - sdk/java/README.md
      - "examples/sdk/**/README.md"
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - sdk/README.md
      - sdk/java/README.md
      - "examples/sdk/**/README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (mkdocs --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install
        run: pip install -r docs/requirements.txt
      # --strict turns every warning (broken internal link, page missing from
      # the nav rules, bad snippet path) into a failure.
      - name: Build
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    # Pull requests only build: the github-pages environment accepts deployments from main alone.
    if: vars.DOCS_PUBLISH_PAGES == 'true' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish the artifact
      id-token: write # OIDC token the Pages deployment verifies
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
