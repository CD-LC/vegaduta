name: Release

# On a version tag (v1.2.3, v1.2.3-rc.1). The full procedure, including the
# one-time GHCR setup, is in docs/maintainers/releasing.md.
#
#   1. prepare   validate the tag, resolve the tagged commit
#   2. verify    refuse to release a commit whose "CI OK" and "CodeQL OK"
#                checks are not green (waits for them if they are still running)
#   3. build     every image natively on amd64 and arm64, pushed by digest
#                only (no tags yet)
#   4. publish   once EVERY build leg succeeded: one multi-arch manifest per
#                image under its immutable version tag, scanned with grype
#                (a critical vulnerability fails the release before anything
#                is signed), then signed with cosign (keyless), SPDX SBOM +
#                SLSA provenance attestations
#   5. omnibus   the single-container personal image (postgres + redis + core
#                + console) is assembled FROM the published images: per-arch
#                builds by digest, then the same manifest/scan/sign/attest as
#                every other image
#   6. charts    once every image is published: Helm charts to GHCR (OCI), signed
#   7. release   a DRAFT GitHub Release: source tarball, SHA256SUMS over every
#                asset, cosign sign-blob bundles (+ .sig/.pem) for the tarballs
#                and SHA256SUMS, SLSA provenance for the tarballs (.intoto.jsonl)
#   8. promote   move the floating tags (latest, <major>.<minor>, postgres 16)
#                - stable releases only, and only after the images and charts
#                above all succeeded
#   9. finalize  publish the draft release
#
# A failure before step 8 leaves the floating tags and the "latest" release
# where they were: a partial run can only have added version-tagged images
# and a draft release, and re-running the workflow on the same tag completes it.
#
# Pre-releases (v1.2.3-rc.1) get version tags only. `latest`, `<major>.<minor>`
# and GitHub's "latest release" (which install.sh downloads by default) never
# point at a pre-release.
#
# Signing identity. Every signature (images, charts, release blobs) is made by
# this workflow running on the tag ref, so the certificate identity is always
#   https://github.com/<owner>/<repo>/.github/workflows/release.yml@refs/tags/v<version>
# A manual re-run must be dispatched ON THE TAG ("Use workflow from: Tags ->
# v1.2.3"); dispatching from a branch is refused, because it would sign with a
# refs/heads/... identity that the documented verify commands reject.
#
# Verify (substitute the owner/repo and version):
#   cosign verify ghcr.io/<owner>/core:<version> \
#     --certificate-identity-regexp '^https://github\.com/<owner>/<repo>/\.github/workflows/release\.yml@refs/tags/v' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \
#     --certificate-identity-regexp '^https://github\.com/<owner>/<repo>/\.github/workflows/release\.yml@refs/tags/v' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   sha256sum -c SHA256SUMS --ignore-missing
#   gh attestation verify oci://ghcr.io/<owner>/core:<version> --repo <owner>/<repo>

# Tag-dispatch only, deliberately: a release is a signed, human-initiated act.
on:
  # Choose the TAG in "Use workflow from"; the workflow refuses non-tag refs.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      minor: ${{ steps.v.outputs.minor }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      owner: ${{ steps.v.outputs.owner }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - name: Require a tag ref
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/tags/v*) ;;
            *) echo "::error::run this workflow on a version tag (Use workflow from: Tags -> vX.Y.Z), not '$REF'"; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - id: v
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if ! [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a v<major>.<minor>.<patch>[-pre] tag"; exit 1
          fi
          minor="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          version="${TAG#v}"
          prerelease=false; [[ "$version" == *-* ]] && prerelease=true
          # The tagged commit itself (an annotated tag peels to its commit), so
          # the image revision label is never a branch sha.
          sha="$(git rev-parse HEAD)"
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "minor=$minor"
            echo "prerelease=$prerelease"
            echo "owner=${OWNER,,}"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

  verify:
    name: Verify CI passed on the tagged commit
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      checks: read # read the check runs of the tagged commit
    steps:
      - name: Wait for CI OK and CodeQL OK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          # The tag normally points at a commit on main that CI already ran on
          # (push to main). Wait up to an hour if those runs are still going.
          for check in "CI OK" "CodeQL OK"; do
            for attempt in $(seq 1 60); do
              runs="$(gh api -X GET "repos/${REPO}/commits/${SHA}/check-runs" \
                -f check_name="$check" -f filter=latest --jq '.check_runs')"
              total="$(jq 'length' <<< "$runs")"
              success="$(jq '[.[] | select(.conclusion == "success")] | length' <<< "$runs")"
              pending="$(jq '[.[] | select(.status != "completed")] | length' <<< "$runs")"
              if [ "$success" -gt 0 ] && [ "$pending" -eq 0 ]; then
                echo "$check: success on ${SHA}"
                continue 2
              fi
              if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
                echo "::error::'$check' did not succeed on ${SHA}:"
                jq -r '.[] | "  \(.name): \(.conclusion)"' <<< "$runs"
                exit 1
              fi
              echo "$check: ${total} run(s), ${pending} pending (attempt ${attempt}/60)"
              sleep 60
            done
            echo "::error::no completed '$check' check on ${SHA} after an hour. Only tag commits that CI has run on (push them to main first)."
            exit 1
          done

  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    needs: [prepare, verify]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    permissions:
      contents: read # check out the tagged commit
      packages: write # push the per-arch image by digest
    strategy:
      # Any failed leg fails the release before anything is tagged, so stop
      # the rest instead of spending runner hours on a release that cannot ship.
      fail-fast: true
      matrix:
        image: [core, core-full, core-worker, core-jobs, web, sidecar, code-intel, app-builder, tool-sandbox, mcp-stdio-runner, mcp-stdio-runner-browser, workspace-runner, browser-runner, voice-agent, rl-trainer, postgres, postgres-cnpg]
        arch: [amd64, arm64]
        include:
          # Essential vs plug-and-play (docs/configuration.md): `core` is the slim
          # image (MCP_TOOLCHAIN=none - STDIO MCP servers run in mcp-stdio-runner);
          # `core-full` carries today's in-core Node/uv/browser toolchain for
          # deployments that cannot run the runner. core-worker/core-jobs are
          # slim only (same release tag as `core`; the charts refuse mixed tags).
          - { image: core, context: core, file: core/Dockerfile, module: app, mcp_toolchain: none }
          - { image: core-full, context: core, file: core/Dockerfile, module: app, mcp_toolchain: full }
          - { image: core-worker, context: core, file: core/Dockerfile, module: app-worker }
          - { image: core-jobs, context: core, file: core/Dockerfile, module: app-jobs }
          - { image: web, context: web, file: web/Dockerfile }
          - { image: sidecar, context: services/sidecar, file: services/sidecar/Dockerfile }
          - { image: code-intel, context: services/code-intel, file: services/code-intel/Dockerfile }
          - { image: app-builder, context: services/app-builder, file: services/app-builder/Dockerfile }
          - { image: tool-sandbox, context: services/tool-sandbox, file: services/tool-sandbox/Dockerfile }
          - { image: mcp-stdio-runner, context: services/mcp-stdio-runner, file: services/mcp-stdio-runner/Dockerfile }
          # Same runner + pinned Playwright Chromium / @playwright/mcp / puppeteer Chrome.
          - { image: mcp-stdio-runner-browser, context: services/mcp-stdio-runner, file: services/mcp-stdio-runner/Dockerfile, with_browsers: 'true' }
          - { image: workspace-runner, context: services/workspace-runner, file: services/workspace-runner/Dockerfile }
          # The Playwright server behind the personal install's browser add-on (deploy/compose/browser.yml).
          - { image: browser-runner, context: services/browser-runner, file: services/browser-runner/Dockerfile }
          - { image: voice-agent, context: services/voice-agent, file: services/voice-agent/Dockerfile }
          - { image: rl-trainer, context: services/rl-trainer, file: services/rl-trainer/Dockerfile }
          - { image: postgres, context: deploy/postgres, file: deploy/postgres/Dockerfile }
          # Same extensions on the CloudNativePG base, for the Helm postgres chart.
          # Published to the same repository under the 16-pgvector-age tag.
          - { image: postgres-cnpg, repo: postgres, context: deploy/postgres, file: deploy/postgres/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      # web reads NEXT_PUBLIC_* at runtime; the values baked in at
      # build time are only the fallback. Repository variables (Settings ->
      # Variables) override the Dockerfile's localhost fallbacks if set.
      - name: Build args
        id: args
        env:
          IMAGE: ${{ matrix.image }}
          MODULE: ${{ matrix.module }}
          MCP_TOOLCHAIN: ${{ matrix.mcp_toolchain }}
          WITH_BROWSERS: ${{ matrix.with_browsers }}
          WEB_PUBLIC_API_BASE_URL: ${{ vars.WEB_PUBLIC_API_BASE_URL }}
          WEB_PUBLIC_KEYCLOAK_URL: ${{ vars.WEB_PUBLIC_KEYCLOAK_URL }}
        run: |
          {
            echo "args<<EOF"
            [ -n "$MODULE" ] && echo "MODULE=$MODULE"
            [ -n "$MCP_TOOLCHAIN" ] && echo "MCP_TOOLCHAIN=$MCP_TOOLCHAIN"
            [ -n "$WITH_BROWSERS" ] && echo "WITH_BROWSERS=$WITH_BROWSERS"
            if [ "$IMAGE" = postgres-cnpg ]; then
              echo "BASE_IMAGE=ghcr.io/cloudnative-pg/postgresql:16.15-system-bookworm@sha256:18db2679228571d798438a4cb9301bccd18acaf3c8a9f184e43f2d4aa5cdf507"
              echo "FINAL_USER=26"
            fi
            if [ "$IMAGE" = web ]; then
              [ -n "$WEB_PUBLIC_API_BASE_URL" ] && echo "NEXT_PUBLIC_API_BASE_URL=$WEB_PUBLIC_API_BASE_URL"
              [ -n "$WEB_PUBLIC_KEYCLOAK_URL" ] && echo "NEXT_PUBLIC_KEYCLOAK_URL=$WEB_PUBLIC_KEYCLOAK_URL"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          build-args: ${{ steps.args.outputs.args }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.licenses=BUSL-1.1
          outputs: type=image,name=${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner }}/${{ matrix.repo || matrix.image }},push-by-digest=true,name-canonical=true,push=true
          # Provenance and SBOM are produced once, on the merged manifest, below.
          provenance: false
          sbom: false
          # No build cache for a release: every layer is rebuilt from the
          # tagged sources and the digest-pinned base images. A type=gha
          # cache is readable by any workflow run in this repository, so a
          # poisoned layer written from a branch (or by a compromised
          # dependency in a CI run) could otherwise be replayed into a signed
          # release image without ever appearing in the diff.
          no-cache: true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests_${{ matrix.image }}_${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.image }}
    # `needs: build` waits for EVERY build leg: no image gets a tag unless all
    # 32 builds succeeded.
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push the manifest, signature and attestations
      id-token: write # keyless cosign + attestations
      attestations: write # record the attestations on the repository
      security-events: write # upload the grype SARIF to code scanning
    strategy:
      fail-fast: false
      matrix:
        image: [core, core-full, core-worker, core-jobs, web, sidecar, code-intel, app-builder, tool-sandbox, mcp-stdio-runner, mcp-stdio-runner-browser, workspace-runner, browser-runner, voice-agent, rl-trainer, postgres, postgres-cnpg]
        include:
          - { image: postgres-cnpg, repo: postgres }
    env:
      IMAGE: ${{ format('{0}/{1}/{2}', 'ghcr.io', needs.prepare.outputs.owner, matrix.repo || matrix.image) }}
      # Every first-party image shares the release version tag (core, core-worker
      # and core-jobs MUST match: the charts refuse mixed core tags). The CNPG
      # Postgres variant lives in the postgres repository under its own tag.
      # Only the immutable version tag is written here; the floating tags move
      # in the `promote` job once everything else has succeeded.
      VERSION_TAG: ${{ matrix.image == 'postgres-cnpg' && format('16-pgvector-age-{0}', needs.prepare.outputs.version) || needs.prepare.outputs.version }}
    steps:
      # Checked out for scripts/ci/defectdojo-import.sh; nothing else in this
      # job reads the tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests_${{ matrix.image }}_*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest (version tag only)
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create -t "${IMAGE}:${VERSION_TAG}" $(printf "${IMAGE}@sha256:%s " *)
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION_TAG}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "${IMAGE}:${VERSION_TAG}@${digest}" >> "$GITHUB_STEP_SUMMARY"

      # Scanned before anything is signed: a manifest with a known critical
      # vulnerability fails the job here, so it never carries a release
      # signature or attestation (and the version tag is never promoted).
      # Scans the exact manifest digest created above, through the registry
      # login from the step before it.
      - name: Vulnerability scan (grype, fail on critical)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.manifest.outputs.digest }}
          fail-build: true
          severity-cutoff: critical
          output-format: table

      # Same manifest re-scanned to SARIF so the release findings also land in
      # Security -> Code scanning (tool "grype", one category per image) and in
      # DefectDojo under the release's engagement. Report-only: the severity
      # gate is the table scan above.
      - name: Vulnerability scan (grype SARIF)
        id: grype-sarif
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.manifest.outputs.digest }}
          fail-build: false
          output-format: sarif

      # Code scanning needs a public repository or GitHub Advanced Security
      # (same check as codeql.yml): on a private repository without it the
      # SARIF upload fails with "Resource not accessible by integration".
      - name: Code scanning available
        id: codescan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ADVANCED_SECURITY: ${{ vars.ADVANCED_SECURITY }}
        run: |
          visibility="$(gh api "repos/$REPO" --jq .visibility)"
          if [ "$visibility" = public ] || [ "$ADVANCED_SECURITY" = true ]; then
            echo "enabled=true" >>"$GITHUB_OUTPUT"
          else
            echo "enabled=false" >>"$GITHUB_OUTPUT"
            echo "::notice::SARIF upload skipped: $visibility repository without Advanced Security (set ADVANCED_SECURITY=true if it is on)"
          fi

      - name: Upload SARIF to code scanning
        if: steps.codescan.outputs.enabled == 'true'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ steps.grype-sarif.outputs.sarif }}
          category: grype-${{ matrix.image }}

      # Optional aggregation sink: a down DefectDojo must not gate a release.
      - name: Push results to DefectDojo
        continue-on-error: true
        env:
          DEFECTDOJO_URL: ${{ vars.DEFECTDOJO_URL }}
          DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
          DEFECTDOJO_ENGAGEMENT: Release ${{ needs.prepare.outputs.version }}
          DEFECTDOJO_VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/ci/defectdojo-import.sh "SARIF" "${{ steps.grype-sarif.outputs.sarif }}"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Signed by digest: the floating tags added later point at the same
      # digest, so this signature and the attestations cover them too.
      - name: Sign (cosign keyless)
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: SBOM (syft, SPDX JSON)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.manifest.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.image }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          sbom-path: sbom-${{ matrix.image }}.spdx.json
          push-to-registry: true

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.spdx.json
          retention-days: 7

  build-omnibus:
    name: Build omnibus (${{ matrix.arch }})
    # Assembled FROM the release's own published images (deploy/omnibus), so
    # it cannot start until `publish` has created every version tag. Builds
    # by digest like `build`; publish-omnibus turns the two digests into the
    # multi-arch manifest.
    needs: [prepare, publish]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read # check out the tagged commit
      packages: write # push the per-arch image by digest
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy
          file: deploy/omnibus/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            REGISTRY=${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner }}
            VEGADUTA_VERSION=${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.licenses=BUSL-1.1
          outputs: type=image,name=${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner }}/omnibus,push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false
          # See the `build` job: a release never reuses cache layers.
          no-cache: true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests_omnibus_${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-omnibus:
    name: Publish omnibus
    # After `publish` (its inputs are version-tagged images) and
    # `build-omnibus` (both arch digests). Mirrors the `publish` job for the
    # single omnibus image: manifest, grype gate, signature, SBOM, SLSA.
    needs: [prepare, publish, build-omnibus]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push the manifest, signature and attestations
      id-token: write # keyless cosign + attestations
      attestations: write # record the attestations on the repository
      security-events: write # upload the grype SARIF to code scanning
    env:
      IMAGE: ${{ format('{0}/{1}/{2}', 'ghcr.io', needs.prepare.outputs.owner, 'omnibus') }}
      VERSION_TAG: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests_omnibus_*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest (version tag only)
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create -t "${IMAGE}:${VERSION_TAG}" $(printf "${IMAGE}@sha256:%s " *)
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION_TAG}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "${IMAGE}:${VERSION_TAG}@${digest}" >> "$GITHUB_STEP_SUMMARY"

      - name: Vulnerability scan (grype, fail on critical)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.manifest.outputs.digest }}
          fail-build: true
          severity-cutoff: critical
          output-format: table

      - name: Vulnerability scan (grype SARIF)
        id: grype-sarif
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.manifest.outputs.digest }}
          fail-build: false
          output-format: sarif

      - name: Code scanning available
        id: codescan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ADVANCED_SECURITY: ${{ vars.ADVANCED_SECURITY }}
        run: |
          visibility="$(gh api "repos/$REPO" --jq .visibility)"
          if [ "$visibility" = public ] || [ "$ADVANCED_SECURITY" = true ]; then
            echo "enabled=true" >>"$GITHUB_OUTPUT"
          else
            echo "enabled=false" >>"$GITHUB_OUTPUT"
            echo "::notice::SARIF upload skipped: $visibility repository without Advanced Security (set ADVANCED_SECURITY=true if it is on)"
          fi

      - name: Upload SARIF to code scanning
        if: steps.codescan.outputs.enabled == 'true'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ steps.grype-sarif.outputs.sarif }}
          category: grype-omnibus

      - name: Push results to DefectDojo
        continue-on-error: true
        env:
          DEFECTDOJO_URL: ${{ vars.DEFECTDOJO_URL }}
          DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
          DEFECTDOJO_ENGAGEMENT: Release ${{ needs.prepare.outputs.version }}
          DEFECTDOJO_VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/ci/defectdojo-import.sh "SARIF" "${{ steps.grype-sarif.outputs.sarif }}"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign (cosign keyless)
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: SBOM (syft, SPDX JSON)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.manifest.outputs.digest }}
          format: spdx-json
          output-file: sbom-omnibus.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          sbom-path: sbom-omnibus.spdx.json
          push-to-registry: true

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-omnibus
          path: sbom-omnibus.spdx.json
          retention-days: 7

  charts:
    name: Helm charts (OCI)
    # After every image is published: a pushed chart never references an image
    # tag that does not exist.
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push the charts
      id-token: write # keyless cosign + attestations
      attestations: write # record the attestations on the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Package charts
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/ci/helm-package.sh "$VERSION" dist/charts > dist-charts.txt && cat dist-charts.txt

      - name: Push and sign charts
        env:
          OWNER: ${{ needs.prepare.outputs.owner }}
          VERSION: ${{ needs.prepare.outputs.version }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | helm registry login "$REGISTRY" -u "$ACTOR" --password-stdin
          echo "$TOKEN" | cosign login "$REGISTRY" -u "$ACTOR" --password-stdin
          while IFS= read -r pkg; do
            [ -n "$pkg" ] || continue
            name="$(basename "$pkg" .tgz)"; name="${name%-"$VERSION"}"
            out="$(helm push "$pkg" "oci://${REGISTRY}/${OWNER}/charts" 2>&1)"; echo "$out"
            digest="$(echo "$out" | awk '/^Digest:/ {print $2}')"
            [ -n "$digest" ] || { echo "::error::no digest for $pkg"; exit 1; }
            cosign sign --yes "${REGISTRY}/${OWNER}/charts/${name}@${digest}"
          done < dist-charts.txt

      - name: Attest chart provenance (SLSA)
        if: hashFiles('dist/charts/*.tgz') != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/charts/*.tgz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helm-charts
          path: dist/charts/*.tgz
          if-no-files-found: warn
          retention-days: 7

  setup-pkg-darwin:
    name: Setup app .dmg (macOS)
    needs: [prepare, verify]
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: installer/go.mod
      # Universal "VegaDuta Setup.app" inside a .dmg with a first-run README.
      # Ad-hoc signed (no notarization yet); the README explains Gatekeeper.
      - name: Build dmg
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cd installer
          ./package.sh darwin --version "${VERSION}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vegaduta-setup-dmg
          path: installer/dist/*.dmg
          retention-days: 5

  release:
    name: GitHub Release (draft)
    needs: [prepare, publish, publish-omnibus, charts, setup-pkg-darwin]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the draft release and upload its assets
      id-token: write # keyless cosign sign-blob + provenance
      attestations: write # record the tarball provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sbom-*
          path: dist/assets
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helm-charts
          path: dist/assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vegaduta-setup-dmg
          path: dist/assets
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Source tarball for install.sh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          # install.sh fetches releases/latest/download/vegaduta.tar.gz or
          # releases/download/v<version>/vegaduta-<version>.tar.gz and strips one
          # top-level directory. Same content under both names.
          #
          # The tree is the tagged commit with the release version written in,
          # so an install from this tarball pulls exactly this release's images
          # and never a moving tag:
          #   - deploy/compose/.env.example: the empty `VEGADUTA_VERSION=` line
          #     becomes `VEGADUTA_VERSION=<version>` (in a git checkout it stays
          #     empty and `scripts/vegaduta up` asks for a version or --build);
          #   - any `__VEGADUTA_VERSION__` placeholder becomes <version>.
          prefix="vegaduta-${VERSION}"
          stage="${RUNNER_TEMP}/src"
          mkdir -p "${stage}/${prefix}"
          git archive --format=tar HEAD | tar -x -C "${stage}/${prefix}"
          envex="${stage}/${prefix}/deploy/compose/.env.example"
          if [ -f "$envex" ]; then
            sed -i -E "s|^VEGADUTA_VERSION=[[:space:]]*$|VEGADUTA_VERSION=${VERSION}|" "$envex"
            grep -qx "VEGADUTA_VERSION=${VERSION}" "$envex" || { echo "::error::could not stamp VEGADUTA_VERSION in deploy/compose/.env.example"; exit 1; }
          fi
          # Personal installs get "Connect Google" out of the box when the repository holds the shipped
          # OAuth client as secrets (see docs/personal-mode.md). Without them the tarball has no file and
          # the console shows how to bring your own client. Never written to the git tree.
          if [ -n "${GOOGLE_OAUTH_CLIENT_ID:-}" ] && [ -n "${GOOGLE_OAUTH_CLIENT_SECRET:-}" ]; then
            gfile="${stage}/${prefix}/deploy/compose/google-oauth.env"
            ( umask 077; printf 'GOOGLE_OAUTH_CLIENT_ID=%s\nGOOGLE_OAUTH_CLIENT_SECRET=%s\n' \
              "$GOOGLE_OAUTH_CLIENT_ID" "$GOOGLE_OAUTH_CLIENT_SECRET" > "$gfile" )
          else
            echo "::warning::GOOGLE_OAUTH_CLIENT_ID/SECRET not set: this release ships without a Google client"
          fi
          { grep -rlZ -e '__VEGADUTA_VERSION__' "${stage}/${prefix}" || true; } | xargs -0 -r sed -i -e "s|__VEGADUTA_VERSION__|${VERSION}|g"
          if grep -rq '__VEGADUTA_VERSION__' "${stage}/${prefix}"; then
            echo "::error::placeholder left in the tarball"; exit 1
          fi
          # Reproducible archive: fixed mtime and owner, sorted entries.
          epoch="$(git log -1 --format=%ct HEAD)"
          tar --sort=name --mtime="@${epoch}" --owner=0 --group=0 --numeric-owner \
            -C "$stage" -cf - "$prefix" | gzip -n > "dist/assets/${prefix}.tar.gz"
          cp "dist/assets/${prefix}.tar.gz" dist/assets/vegaduta.tar.gz

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: installer/go.mod

      # vegaduta-setup: the browser-wizard installer (installer/). package.sh
      # builds the Windows/Linux artifacts (first-run README inside each); the
      # darwin tarballs are the bare binaries for terminal users, the friendly
      # .dmg is built by the setup-pkg-darwin job on a macOS runner. Unsigned
      # for now (Apple notarization / Windows signing are a procurement item):
      # Gatekeeper and SmartScreen will warn; the READMEs explain the click
      # path and the SHA256SUMS below still covers every binary.
      - name: Build vegaduta-setup binaries
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cd installer
          ./package.sh linux --version "${VERSION}" --out ../dist/assets
          ./package.sh windows --version "${VERSION}" --out ../dist/assets
          for arch in amd64 arm64; do
            out="vegaduta-setup-darwin-${arch}"
            CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.buildVersion=${VERSION}" -o "$out" .
            tar -czf "../dist/assets/${out}.tar.gz" "$out"
          done

      - name: Attest tarball provenance (SLSA)
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/assets/*.tar.gz

      - name: Checksums and signatures
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        working-directory: dist/assets
        run: |
          shopt -s nullglob
          # SHA256SUMS: GNU coreutils format, "<sha256>  <file name>" (two
          # spaces), one line per release asset, bare file names. Verify with
          # `sha256sum -c SHA256SUMS --ignore-missing`.
          files=(*.tar.gz *.tgz *.zip *.dmg *.spdx.json)
          sha256sum -- "${files[@]}" | LC_ALL=C sort -k2 > SHA256SUMS
          cat SHA256SUMS
          # Keyless cosign signatures. The Sigstore bundle (*.sigstore.json)
          # holds the signature, the Fulcio certificate and the Rekor entry;
          # .sig and .pem are the same signature and certificate as plain files.
          for f in SHA256SUMS vegaduta.tar.gz "vegaduta-${VERSION}.tar.gz"; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
            jq -r '.messageSignature.signature' "${f}.sigstore.json" > "${f}.sig"
            {
              echo "-----BEGIN CERTIFICATE-----"
              jq -r '.verificationMaterial.certificate.rawBytes // .verificationMaterial.x509CertificateChain.certificates[0].rawBytes' "${f}.sigstore.json" | fold -w 64
              echo "-----END CERTIFICATE-----"
            } > "${f}.pem"
          done
          # SLSA provenance for the tarballs as a release asset.
          cp "$BUNDLE" "vegaduta-${VERSION}.intoto.jsonl"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          OWNER: ${{ needs.prepare.outputs.owner }}
          REPO: ${{ github.repository }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The CHANGELOG section for this version, if there is one.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          generate=false
          grep -q '[^[:space:]]' notes.md || generate=true
          {
            echo
            echo "### Images"
            echo
            echo "Multi-arch (linux/amd64, linux/arm64), signed with cosign (keyless), with SPDX SBOM and SLSA provenance attestations:"
            echo
            for s in dist/assets/sbom-*.spdx.json; do
              [ -e "$s" ] || continue
              img="$(basename "$s" .spdx.json)"; img="${img#sbom-}"
              if [ "$img" = postgres-cnpg ]; then
                echo "- \`ghcr.io/${OWNER}/postgres:16-pgvector-age-${VERSION}\` (CloudNativePG operand)"
              else
                echo "- \`ghcr.io/${OWNER}/${img}:${VERSION}\`"
              fi
            done
            echo
            echo "Helm charts: \`oci://ghcr.io/${OWNER}/charts\` (version ${VERSION})."
            echo
            echo "### Verify the download"
            echo
            echo '```sh'
            echo "cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \\"
            echo "  --certificate-identity-regexp '^https://github\\.com/${REPO}/\\.github/workflows/release\\.yml@refs/tags/v' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo '```'
          } >> notes.md
          flags=(--draft --title "$TAG" --notes-file notes.md --verify-tag)
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease --latest=false); fi
          [ "$generate" = true ] && flags+=(--generate-notes)
          # A re-run replaces an earlier draft for the same tag; a published
          # release is never overwritten.
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = true ]; then
            gh release delete "$TAG" --yes
          elif gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release $TAG is already published"; exit 1
          fi
          shopt -s nullglob
          gh release create "$TAG" "${flags[@]}" dist/assets/*

  promote:
    name: Move floating tags (stable only)
    needs: [prepare, publish, publish-omnibus, charts, release]
    if: needs.prepare.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # add tags to existing manifests
    env:
      OWNER: ${{ needs.prepare.outputs.owner }}
      VERSION: ${{ needs.prepare.outputs.version }}
      MINOR: ${{ needs.prepare.outputs.minor }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: latest, <major>.<minor>, postgres 16 / 16-pgvector-age
        run: |
          # Re-tag the already signed manifests (same digest, so signatures and
          # attestations still apply). Every source tag is checked first, so
          # nothing moves unless all of them exist.
          base="${REGISTRY}/${OWNER}"
          images=(core core-full core-worker core-jobs web sidecar code-intel app-builder tool-sandbox mcp-stdio-runner mcp-stdio-runner-browser workspace-runner browser-runner voice-agent rl-trainer postgres omnibus)
          for img in "${images[@]}"; do
            docker buildx imagetools inspect "${base}/${img}:${VERSION}" > /dev/null
          done
          docker buildx imagetools inspect "${base}/postgres:16-pgvector-age-${VERSION}" > /dev/null
          for img in "${images[@]}"; do
            tags=(-t "${base}/${img}:latest" -t "${base}/${img}:${MINOR}")
            # The compose files reference the database image by its Postgres
            # major (ghcr.io/<owner>/postgres:16).
            [ "$img" = postgres ] && tags+=(-t "${base}/postgres:16")
            docker buildx imagetools create "${tags[@]}" "${base}/${img}:${VERSION}"
            echo "${base}/${img}:${VERSION} -> latest, ${MINOR}" >> "$GITHUB_STEP_SUMMARY"
          done
          docker buildx imagetools create -t "${base}/postgres:16-pgvector-age" "${base}/postgres:16-pgvector-age-${VERSION}"

  finalize:
    name: Publish the release
    needs: [prepare, release, promote]
    # promote is skipped for pre-releases; publish those once the draft exists.
    if: always() && needs.release.result == 'success' && (needs.promote.result == 'success' || needs.promote.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # publish the draft release
    steps:
      - name: Publish draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$TAG" --repo "$REPO" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --repo "$REPO" --draft=false --latest
          fi
