name: Documentation problem
description: A wrong, missing, outdated or unclear page, command or link.
labels: [documentation, needs-triage]
body:
  - type: input
    id: page
    attributes:
      label: Where
      description: The file or page (for example `docs/getting-started.md`) and, if relevant, the section.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
      description: Quote the text or command, and say what actually happened when you followed it (version or commit, OS, tier).
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to fix this myself (see CONTRIBUTING.md)
