# SonarQube analysis for the whole platform (one project, monorepo mode).
# Used by sonar-scanner CLI and by SonarSource/sonarqube-scan-action
# (.github/workflows/sonarqube.yml).
#
# SonarQube Cloud: set sonar.organization and the scan uses
# SONAR_HOST_URL=https://sonarcloud.io. Self-hosted: SONAR_HOST_URL points at
# your server; no sonar.organization needed.
sonar.projectKey=vegaduta-oss
sonar.projectName=VegaDuta OSS
sonar.sourceEncoding=UTF-8

# Production sources. Everything matching sonar.test.inclusions under
# sonar.tests is classified as test code and excluded from the coverage
# denominator and duplication metrics.
sonar.sources=core,sdk/java,sdk/python-agent,web/app,services,examples,contracts,deploy/helm,infra/terraform
sonar.tests=core,sdk/java,sdk/python-agent,web/app,services,tests
sonar.test.inclusions=**/src/test/**,**/*.test.*,**/*.spec.*,**/tests/**,**/test_*.py

# Build output, vendored and generated code. sdk/typescript and sdk/python are
# generated REST clients (sdk/generate.mjs); generated code metrics are noise.
sonar.exclusions=\
  **/node_modules/**,**/.next/**,**/dist/**,**/out/**,**/target/**,\
  **/coverage/**,**/.ruff_cache/**,**/__pycache__/**,**/.venv/**,**/venv/**,\
  sdk/typescript/**,sdk/python/**,\
  **/generated/**,**/LICENSES/**

# Java: the CLI scanner needs compiled classes (mvn package first) to resolve
# types; JaCoCo XML is produced per module by the -Pcoverage profile.
# Test classes and the dependency jars matter too: without them sonar-java
# cannot resolve JUnit/Spring types, so rules that need them go quiet and
# java:S2187 ("add some tests") fires on every class whose tests live only in
# @Nested classes. The jars are passed by the workflow (the Maven repository
# path is runner-specific); for a local scan add
#   -Dsonar.java.libraries="$HOME/.m2/repository/**/*.jar"
#   -Dsonar.java.test.libraries="$HOME/.m2/repository/**/*.jar"
sonar.java.binaries=core/**/target/classes,sdk/java/**/target/classes
sonar.java.test.binaries=core/**/target/test-classes,sdk/java/**/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=core/**/target/site/jacoco/jacoco.xml

# TypeScript: `npm run test:coverage` (vitest, v8 provider) writes lcov here.
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info

# Python: pytest --cov-report=xml (pytest-cov), one file per service.
sonar.python.coverage.reportPaths=services/sidecar/coverage.xml,sdk/python-agent/coverage.xml

# Keep duplication metrics meaningful: skip generated SDKs and Flyway
# migrations (near-identical DDL is expected there).
sonar.cpd.exclusions=sdk/**,core/app/src/main/resources/db/migration/**
