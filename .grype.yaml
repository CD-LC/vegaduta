# Grype configuration for the release image scans (.github/workflows/release.yml).
# The fail-on-critical gate runs with only-fixed: true, so a CVE listed here is
# belt-and-suspenders for anyone re-tightening the gate: every entry is scoped to
# a vulnerability ID plus its wont-fix state, so the moment Debian ships a
# backport the exception stops matching and the finding gates again. Re-evaluate
# the whole list on the next base-image migration; add a comment and a date for
# any new entry.
ignore:
  # Debian bookworm "won't fix" triage - glibc; no backport planned for deb12.
  - vulnerability: CVE-2026-5450
    fix-state: wont-fix
    package:
      name: libc6
  - vulnerability: CVE-2026-5450
    fix-state: wont-fix
    package:
      name: libc-bin
  # Debian bookworm "won't fix" triage - curl (gnutls flavour); no backport.
  - vulnerability: CVE-2026-19931
    fix-state: wont-fix
    package:
      name: libcurl3-gnutls
  - vulnerability: CVE-2026-11856
    fix-state: wont-fix
    package:
      name: libcurl3-gnutls
  - vulnerability: CVE-2026-8924
    fix-state: wont-fix
    package:
      name: libcurl3-gnutls
  - vulnerability: CVE-2026-10536
    fix-state: wont-fix
    package:
      name: libcurl3-gnutls
  - vulnerability: CVE-2026-18924
    fix-state: wont-fix
    package:
      name: libcurl3-gnutls
  - vulnerability: CVE-2026-8927
    fix-state: wont-fix
    package:
      name: libcurl3-gnutls
  # PyAV (faster-whisper's audio-decode wheel) vendors its own ffmpeg build;
  # the newest wheel (15.1.0, bundled ffmpeg 7.1.x) still predates the upstream
  # 8.1 fix. Surface is local audio transcription only. Re-evaluate when a
  # wheel shipping ffmpeg >= 8.1 exists. (2026-10-20)
  - vulnerability: CVE-2026-40962
    package:
      name: ffmpeg
  # MCP Java SDK (io.modelcontextprotocol.sdk:mcp-core 0.18.3, pulled by Spring AI 1.1.8):
  # GHSA-8jxr-pr72-r468, DNS rebinding because the SDK's server transport did not validate
  # Origin before 1.0.0. The only patched release is 1.0.0, which drops classes core's own
  # code needs (the SSE endpoint origin pin and the Jackson 2 JSON mapper), so it cannot be
  # pinned under Spring AI 1.1.x. Accepted by the maintainer on 2026-10-22 until the
  # Spring AI 2 / Spring Boot 4 migration. Mitigation in core: /mcp is guarded by
  # McpOriginValidationFilter (mode enforce by default, app.mcpserver.origin.mode; test
  # McpOriginValidationFilterTest; docs/architecture/mcp-spec-alignment.md row T2), which
  # answers 403 to a present, unlisted Origin before any credential lookup. Re-evaluate on
  # the Spring AI 2 migration, or if that default changes.
  - vulnerability: GHSA-8jxr-pr72-r468
    package:
      name: mcp-core
      version: 0.18.3
