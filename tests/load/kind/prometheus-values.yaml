# Minimal Prometheus for the kind stage: scrapes only the core API pods, no persistence, nothing else.
# Used to test request-based autoscaling (deploy/helm/examples/values-autoscaling.yaml). Not a production setup:
# production uses kube-prometheus-stack with global.serviceMonitor.enabled=true.
alertmanager: { enabled: false }
kube-state-metrics: { enabled: false }
prometheus-node-exporter: { enabled: false }
prometheus-pushgateway: { enabled: false }
server:
  persistentVolume: { enabled: false }
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }
  global:
    scrape_interval: 10s
serverFiles:
  prometheus.yml:
    scrape_configs:
      - job_name: vegaduta-core
        metrics_path: /actuator/prometheus
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [vegaduta] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: core
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            action: keep
            regex: api
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "8080"
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
