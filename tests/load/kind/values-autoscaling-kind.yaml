# Request-based autoscaling on the kind stage (needs tests/load/kind/prometheus*.yaml installed in namespace monitoring).
# Same shape as deploy/helm/examples/values-autoscaling.yaml with a target sized for a laptop: 6 open requests per pod.
core:
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 80
    metrics:
      - type: Pods
        pods:
          metric:
            name: http_server_requests_active
          target:
            type: AverageValue
            averageValue: "6"
