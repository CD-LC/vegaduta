[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vegaduta-sdk"  # placeholder name until a package name is reserved
version = "0.1.0"
description = "Python SDK for the VegaDuta REST API (generated from docs/api/openapi.json)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[tool.setuptools]
packages = ["vegaduta_sdk", "vegaduta_sdk.generated"]

[tool.setuptools.package-data]
vegaduta_sdk = ["py.typed"]
