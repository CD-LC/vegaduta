[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vegaduta-agent"
version = "0.1.0"
description = "Governance for AI agents in Python: tool risk classification, human approval, budgets, idempotent effects, guardrails, hooks, audit and telemetry."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "VegaDūta contributors" }]
keywords = ["ai", "agents", "governance", "guardrails", "llm", "mcp", "owasp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
# Zero runtime dependencies: the core works on the standard library alone, so
# it can wrap tools from any framework — or no framework at all.
dependencies = []

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
otel = ["opentelemetry-api>=1.25"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/CD-LC/vegaduta"
Repository = "https://github.com/CD-LC/vegaduta/tree/main/sdk/python-agent"

[tool.setuptools.packages.find]
include = ["vegaduta_agent*"]

[tool.setuptools.package-data]
vegaduta_agent = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
