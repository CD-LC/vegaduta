[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vegaduta-agent"
version = "0.1.0"
description = "Governance for AI agents in Python: tool risk classification, human approval, budgets, idempotent effects, guardrails, hooks, audit and telemetry."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "VegaDūta contributors" }]
keywords = ["ai", "agents", "governance", "guardrails", "llm", "mcp", "owasp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
# Zero runtime dependencies: the core works on the standard library alone, so
# it can wrap tools from any framework — or no framework at all.
dependencies = []

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
otel = ["opentelemetry-api>=1.25"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "build>=1"]

[project.urls]
Homepage = "https://vegaduta.ai"
Repository = "https://github.com/CD-LC/vegaduta/tree/main/sdk/python-agent"
Issues = "https://github.com/CD-LC/vegaduta/issues"
Changelog = "https://github.com/CD-LC/vegaduta/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["vegaduta_agent*"]

[tool.setuptools.package-data]
vegaduta_agent = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["vegaduta_agent"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = [
    "S101",  # assert in tests is the point of a test
]

[tool.mypy]
python_version = "3.10"
packages = ["vegaduta_agent"]
warn_return_any = true
warn_unused_ignores = true
strict = false  # ratchet: tighten module by module, never loosen

