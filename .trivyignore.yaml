# Findings accepted individually, with a reason - see trivy.yaml's header.
# Scoped to a path wherever possible; an unscoped entry suppresses the check
# for the whole repository, which is not what "accepted" means.
misconfigurations:
  - id: AVD-DS-0002
    paths:
      - services/tool-sandbox/Dockerfile
    statement: >
      Intentional: the service must start as root so it can drop tenant code
      to uid/gid 5001 (setpriv needs CAP_SETUID/CAP_SETGID) and SIGKILL the
      child on timeout (CAP_KILL). Tenant code never runs as root; compose and
      helm drop every other capability and set no-new-privileges, and the app
      refuses to start when CAP_KILL is missing unless explicitly configured
      to allow it. See services/tool-sandbox/README.md's security model.
  - id: AVD-DS-0002
    paths:
      - deploy/omnibus/Dockerfile
    statement: >
      Intentional: the omnibus is a single-container supervisor, not a single
      app - entrypoint.sh must run as root so it can initdb/start postgres,
      launch redis, and hand core+web to their own users (gosu postgres /
      gosu redis / gosu agentic per service). No workload process runs as
      root at steady state.
  - id: AVD-DS-0002
    paths:
      - deploy/postgres/Dockerfile
      - deploy/postgres/Dockerfile.alpine
    statement: >
      Intentional: the official postgres entrypoint must start as root so it
      can chown the data directory, then drops itself to the postgres user via
      gosu before exec'ing postgres. postgres never runs as root at steady
      state. deploy/postgres/Dockerfile's FINAL_USER ARG keeps the same model.
  - id: AVD-DS-0001
    paths:
      - deploy/omnibus/Dockerfile
    statement: >
      The release images the omnibus assembles are digest-pinned
      (@sha256:${*_IMAGE_DIGEST} resolved by the release workflow after
      publish); a tag-less digest ref is a stronger pin than a tagged ref -
      this check's "specify a tag" guidance is weaker than what is there.
  - id: AVD-DS-0002
    paths:
      - .clusterfuzzlite/Dockerfile
    statement: >
      Intentional: this is the ClusterFuzzLite build container. It exists only
      inside the fuzz CI job to compile the Jazzer targets; it is never pushed
      to a registry and never runs a workload. The oss-fuzz-base builder
      contract requires root for apt installs and writes to $SRC/$OUT.
  - id: AVD-DS-0026
    paths:
      - .clusterfuzzlite/Dockerfile
    statement: >
      The image is a CI build tool, not a service: ClusterFuzzLite invokes
      build.sh once and discards the container. There is no daemon to health
      check.
vulnerabilities:
  - id: CVE-2026-47890
    paths:
      - core/omnichannel/pom.xml
      - core/elevenlabs/pom.xml
    statement: >
      spring-webmvc 6.2.19 (Spring Boot 3.5.16 BOM) has no fix on the 6.2
      line; the only fixed version is 7.0.9, which requires the Spring
      Boot 4.1 / Spring Framework 7 migration tracked by PR #99. No 6.2.x
      release ships a patch (checked Maven Central, 6.2.19 is the latest).
  - id: CVE-2026-47884
    paths:
      - core/omnichannel/pom.xml
      - core/elevenlabs/pom.xml
    statement: >
      Same as CVE-2026-47890: spring-webmvc 6.2.19, fixed only in 7.0.9,
      unblocks with the Spring Boot 4.1 migration (PR #99).
