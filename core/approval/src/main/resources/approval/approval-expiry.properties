# Code defaults for app.approvals.expiry.* (ApprovalExpiryProperties). The same text is shipped in
# application.yml so an operator can see and change it; this file is what a context without that yml
# (a slim test, an embedded use of the module) falls back to.
#
# expired-reason is recorded as the rejection reason of a request nobody decided in time. It is what
# the agent that asked reads back (in the continuation of a resumed job or session, as the reason the
# action was not run), so it says plainly that the action did NOT run and that it may be asked again.
# {ttl} is filled with how long the request waited, for example "24 hours".
expired-reason=No one approved or rejected this request within {ttl}, so it expired and the action was NOT performed. The request can no longer be approved. If the action is still needed, ask for it again or take another route to the goal.
