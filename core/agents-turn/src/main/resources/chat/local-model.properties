# Code defaults for app.chat.local-model.* (LocalModelTurnProperties). The same values are shipped in application.yml
# so an operator can see and change them; this file is what a context without that yml (a slim test, an embedded use
# of the module) falls back to. One line per value.
#
# A model served on the person's own machine (the install's Ollama pool row, or a bring-your-own provider listed in
# providers) reads its prompt at a few hundred tokens a second on a laptop GPU and far slower on a CPU, and its server
# keeps one prompt cache. Ollama's templates put the tool definitions ahead of the system prompt, so a tool set that
# changes from one message to the next makes the server re-read the whole prompt on every turn, while an unchanged
# one is answered from the cache in well under a second.
#  - stable-tools: true offers a local model the agent's tool set unchanged and in a fixed order on every turn (no
#    per-message relevance trimming), so every turn after the first is a cache hit and a tool the message did not
#    name (web search) is never missing. A model in small-model mode keeps its short six-tool list either way: on a
#    CPU-only machine a short prompt matters more than a cached one. false = per-message selection, as for hosted
#    models.
#  - providers: bring-your-own providers (ProviderName) that are servers on the person's machine.
stable-tools=true
providers=OLLAMA,LOCAL_OPENAI
