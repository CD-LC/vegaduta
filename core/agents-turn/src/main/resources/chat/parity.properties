# Code defaults for app.chat.parity.* (ChatParityProperties). The same values are shipped in application.yml so
# an operator can see and change them; this file is what a context without that yml (a slim test, an embedded use
# of the module) falls back to. One line per value.
#
# The same agent should behave the same whether its reasoning depth streams the reply (FAST) or buffers it
# (CAREFUL, RIGOROUS, PLANNED). What the two paths share is not configurable: one continuation policy, the
# provider's finish-reason handling, the thought-signature fallback, the replay gate, tool ordering, and the
# user's message sent to the model unchanged. What genuinely differs, and why, is listed here so it is a choice
# rather than an accident.
#
#  - fast-buffering-triggers: a FAST turn is normally streamed token by token. A turn that matches one of these
#    is buffered instead (the whole reply is held, checked, then sent as one piece), which gives up streaming
#    for a check that needs the complete reply:
#      GENERATION_TOOLS   the turn offers an image/document/audio/video generation tool: a fabricated result
#                         link is replaced before it reaches the person (the live-incident guard).
#      MCP_TOOLS          the turn offers any tool from an MCP server (the same guard: browsing and generation
#                         tools come from MCP servers).
#      OUTPUT_GUARDRAILS  the agent has content guardrails on the OUTPUT path. Off by default: FAST audits a
#                         violating reply after it was delivered, because the tokens already left; with this
#                         set the reply is held and a violating one is withheld and replaced, as the buffered
#                         depths do, and the replacement is what is stored.
#    An empty list never buffers a FAST turn.
#
#  - verifier-max-evidence-chars: the buffered verifiers (self-consistency, Reflexion) are shown what the turn's
#    tools returned; it is cut to the newest this-many characters. 0 = no cut.
#  - verifier-min-revision-ratio / verifier-ratio-applies-above-chars: a verifier that finds a problem rewrites
#    the answer WITHOUT tools (re-running them could repeat a side effect). A rewrite shorter than this fraction
#    of an answer longer than the threshold is not accepted: the original answer is kept. 0 = accept any rewrite.
fast-buffering-triggers=GENERATION_TOOLS,MCP_TOOLS
verifier-max-evidence-chars=12000
verifier-min-revision-ratio=0.3
verifier-ratio-applies-above-chars=400
# verifier-history-window: the buffered verifiers also see this many of the newest earlier messages of the
# conversation, so a contradiction with an earlier turn is visible to them. Bounded because it is a cheap
# grounding check, not the turn's real context.
verifier-history-window=6
