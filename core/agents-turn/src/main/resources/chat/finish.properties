# Code defaults for app.chat.finish.* (ChatFinishProperties). The same values are shipped in application.yml
# so an operator can see and change them; this file is what a context without that yml (a slim test, an
# embedded use of the module) falls back to. One line per value.
#
# What a turn does with the provider's finish reason (Anthropic stop_reason, OpenAI finish_reason, Gemini
# finishReason, Ollama done_reason). A reply cut off by the output limit is continued; a reply the safety
# system stopped, an unusable tool call and an empty reply get an honest message instead of silence or a
# request to rephrase; none of those is stored as an answer or cached.
#
# The two nudges sent to the model as the next user message are not here: they are the prompt-registry keys
# nudge.reply_cut_off and nudge.retry_tool_call (prompts/en/). The notices shown to the person are the keys
# message.finish.truncated, message.finish.refusal ({reason} is the provider's own finish reason, e.g. SAFETY,
# content_filter, refusal), message.finish.malformed_tool_call and message.finish.empty_reply. The deprecated
# properties app.chat.finish.*-notice and empty-reply-message seed their platform default (PromptPropertyAliases).
enabled=true
max-continuations=2
max-tool-call-retries=1
