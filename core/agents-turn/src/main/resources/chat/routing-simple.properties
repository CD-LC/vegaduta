# Code defaults for app.routing.simple.* (RoutingSimpleProperties). The same values are shipped in
# application.yml so an operator can see and change them; this file is what a context without that yml (a
# slim test, an embedded use of the module) falls back to. One line per value.
#
# Cost routing (an agent with an economy model) sends a message to the economy model only when the heuristic
# below calls it simple: short, one or two sentences, no code, none of the signal words. Every threshold fails
# toward "keep the primary model": a wrongly cheap answer costs more than a wrongly expensive one.
#  - max-chars: a longer message is never simple.
#  - max-clauses: more sentences than this is never simple.
#  - clause-boundary: where one sentence ends and the next begins (ASCII terminators need a space after them, so
#    "3.5" and "e.g." are not cut; the full stops of Chinese, Japanese, Hindi and Arabic need none).
#  - signal-words.<lang>: comma-separated phrases that mean analysis, generation or multi-step work. A language is
#    added by adding its key; a message is checked against every language.
#  - non-latin-simple: false = a message with letters outside the Latin script is never simple, because the signal
#    words cannot tell whether it is a hard question (a Hindi question about debugging read as short and
#    keyword-free). true = such a message is judged by length and clauses, and by any signal words configured
#    for its language.
#  - accented-latin-simple: false = a message with accented Latin letters (Spanish, French, German, Vietnamese,
#    ...) is never simple, for the same reason: no signal words are shipped for those languages. true = such a
#    message is judged by length, clauses and any signal words configured for its language.
max-chars=160
max-clauses=2
clause-boundary=[.?!]+\\s+|[\\u3002\\uff01\\uff1f\\u0964\\u061f]+\\s*
non-latin-simple=false
accented-latin-simple=false
signal-words.en=compare,analyze,analyse,design,architecture,debug,refactor,optimize,step by step,step-by-step,write a,generate a,draft a,plan,strategy,summarize the following,translate the following,explain in detail,pros and cons,code,function,algorithm,query,script,regex,sql
