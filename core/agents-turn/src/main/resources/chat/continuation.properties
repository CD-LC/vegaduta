# Code defaults for app.chat.continuation.* (ContinuationProperties). The same values are shipped in
# application.yml so an operator can see and change them; this file is what a context without that yml (a
# slim test, an embedded use of the module) falls back to. One line per value. (app.chat.continuation.max-passes,
# the number of extra passes, is read separately by ChatTimeouts.)
#
# A model that writes "Let me create the file:" and then ends its reply without calling the tool leaves the task
# unfinished although the tool loop saw a normal end. Small and local models do this routinely; a frontier
# model's text-only reply is an answer. So the wording check below runs only for a model that is a weak tool
# caller (heuristic-scope), and never for a turn parked on a human approval or whose reply the provider's finish
# reason already explained (cut off, refused, ...).
#  - heuristic-enabled: false never re-prompts on wording at all.
#  - heuristic-scope: SMALL_MODELS (default) = only a weak tool caller; ALL_MODELS = every model.
#  - heuristic-providers: bring-your-own providers treated as weak tool callers (local servers).
#  - heuristic-tool-grades: a platform-hosted pool row measured at one of these grades (ToolCallGrade) is one too,
#    as is a row running in small-model mode.
#  - tail-chars: how much of the end of the reply is read.
#
# The patterns are regular expressions (case-insensitive, Unicode), one per language tag, so a language is added by
# adding its keys. A reply is checked against every language; the language that matched picks the nudge.
#  - intent.<lang>: the model says what it is about to do (tested on the LAST sentence only).
#  - closing.<lang>: the sentence is an offer of further help ("let me know ..."), never an announced step.
#  - done.<lang>: the reply says the work is finished or is a summary.
#  - asks.<lang>: the reply ends by asking the person something.
#  - unfinished-ending.<lang>: the reply stops where a list or a block was about to start.
# The nudge sent to the model as the next user message is not here: it is the prompt-registry key
# nudge.continue_unfinished (core/agents-turn prompts/<lang>/). A nudge.<lang> entry is a deprecated alias.
heuristic-enabled=true
heuristic-scope=SMALL_MODELS
heuristic-providers=OLLAMA,LOCAL_OPENAI
heuristic-tool-grades=TEXT,NONE
tail-chars=400
default-locale=en
intent.en=\\b(let me|let's|i'll|i will|i am going to|i'm going to|i need to|i should|next,? i|now i|now let|going to (create|write|run|check|add|build|install|update|fix)|(give me|wait) (a|one) (moment|second|minute)|one moment|just a moment|please wait|bear with me)\\b
closing.en=\\b(let me know|let us know|feel free|happy to help|hope (this|that) helps|anything else|if you (need|want|have|would like|'d like)|don't hesitate)\\b
done.en=\\b(all done|is done|are done|completed|is complete|finished|all set|here is a summary|summary:|in summary|that's everything|ready to use|you can now)\\b
asks.en=[?？؟]$
unfinished-ending.en=[:：]$
