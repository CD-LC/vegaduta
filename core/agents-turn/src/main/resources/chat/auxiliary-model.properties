# Code defaults for app.auxiliary-model.* (AuxiliaryModelProperties). The same values are shipped in
# application.yml so an operator can see and change them; this file is what a context without that yml (a
# slim test, an embedded use of the module) falls back to. One line per value.
#
# The background model calls that are not an agent's answer (context compaction, the session summary, the
# "Ask AI" assist, judges) need a model when the tenant uses its own provider key. They used to take the first
# model of the first active credential's catalog listing, which is alphabetical: price and quality followed sort
# order. The model is now chosen in this order, first one that is usable wins:
#   1. the tenant's AI Model Control preference for the purpose (assist, eval-judge; the tenant default row for
#      the others, applied by the gateway when the provider is the one chosen below);
#   2. the platform choice: app.auxiliary-model.<purpose>.provider and .model (provider alone = that provider's
#      catalog default model; a model without a provider is ignored);
#   3. the provider and model of the agent the call is made for (use-agent-model);
#   4. the provider with the best credential and its catalog default model (never the first alphabetical one).
# <purpose> is compaction, session-summary, assist or judge; none is set by default.
#  - use-agent-model: false skips step 3, so a call made for an agent no longer follows that agent's model.
use-agent-model=true
