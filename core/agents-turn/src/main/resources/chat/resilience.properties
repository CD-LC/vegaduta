# Code defaults for app.chat.resilience.* (ChatResilienceProperties). The same values are shipped in
# application.yml so an operator can see and change them; this file is what a context without that yml (a
# slim test, an embedded use of the module) falls back to. One line per value.
#
# How a chat turn behaves when it runs long or a provider fails while tools are involved:
#  - tool-idle-ceiling: the stream idle timer (app.llm.http.stream-idle-timeout) counts model silence only;
#    while a tool runs it is suspended, up to this long since the tool last started, finished or reported
#    progress (a tool that outlives it is treated as hung).
#  - replay-after-journaled-effects: a turn that already ran a write/send tool is replayed on another provider
#    only when the effect journal recorded every such call (an identical repeat is then served from the
#    journal); false never replays a turn after a tool with side effects ran.
#  - retry-at-fast-when-no-tool-ran: a CAREFUL/RIGOROUS/PLANNED turn that hit its time limit before any tool ran
#    is answered again at FAST depth with its tools; false always reports the timeout.
#  - thought-signature-degrade: Gemini refuses the request that follows a tool call when the model's own call is
#    sent back without the signature it put on it. The platform sends it back intact, so this should not
#    happen; if the provider still refuses, the turn is answered once more WITHOUT tools - the person is told so
#    (thought-signature-notice), the tool results gathered so far are put in front of the model
#    (thought-signature-evidence-note, at most thought-signature-evidence-chars of them), and the reply is not
#    cached. false reports the provider's error instead.
#
#  - structured-call-timeout: how long a structured (typed input and output) agent call, such as a workflow node,
#    waits for the reply before giving up.
#  - hosted-self-heal-cooldown: least time between two repair attempts for the same hosted-pool row whose model id
#    the provider reports gone; keeps a persistently failing row from refreshing the catalog on every turn.
#
# The *-notice values are shown to the person (or sent on the step-event channel); {depth}, {seconds},
# {completed}, {running} and {tools} are filled in per turn; none is shown to the model.
tool-idle-ceiling=PT30M
replay-after-journaled-effects=true
retry-at-fast-when-no-tool-ran=true
list-none=none
depth-timeout-partial-notice=This request ran past the {seconds}-second limit for a {depth} reply, so it was stopped before the final answer was written. Steps that had already run: {completed}. Steps still running when it stopped: {running}. Nothing was undone, so check the results of those steps before asking to continue.
depth-timeout-degraded-notice=Degraded: the {depth} answer took too long on this model before any tool ran, so this reply was produced directly at FAST depth. Set the agent to FAST depth to avoid this.
replay-blocked-notice=The model provider failed after tools had already run ({tools}). The request was not retried on another model, so those actions are not repeated; check their results before trying again.
thought-signature-degrade=false
thought-signature-evidence-chars=8000
thought-signature-notice=The model provider refused this turn's tool calls (a Gemini thought-signature error), so the rest of this reply was written without any tools. Steps that had already run: {tools}. Check what they did before relying on this answer.
thought-signature-evidence-note=Your tools are no longer available in this reply. This is what the tools you already called returned; answer from it, and say plainly what could not be done or checked:\n{evidence}
structured-call-timeout=PT2M
hosted-self-heal-cooldown=PT10M
