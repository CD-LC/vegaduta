# Code defaults for app.chat.cache.* (ChatCacheProperties). The same values are shipped in application.yml so an
# operator can see and change them; this file is what a context without that yml (a slim test, an embedded use of
# the module) falls back to. One line per value.
#
# The exact-match and the semantic response caches are opt-in per agent. They used to key on the single message
# and to serve and store any turn, so "yes" or "continue" returned the answer cached for a different
# conversation, and a turn that had read live data through a tool could be answered (or stored) from a cache.
#  - eligible-with-tools: false (default) keeps both caches out of any turn of an agent that offers tools: they
#    are neither read nor written, and a turn whose model called a tool is never stored. true restores the old
#    behaviour for an agent whose tools return nothing that changes (the operator's call, per deployment).
#  - key-on-conversation: true (default) keys both caches on the conversation so far as well as on the message:
#    the first message of a conversation keys on the message alone (an FAQ still hits), a later one also on the
#    latest context-turns turns before it. false keys on the message alone, as before.
#  - context-turns: how many of the newest earlier turns (a user turn and an assistant turn count one each) go
#    into the key.
eligible-with-tools=false
key-on-conversation=true
context-turns=2
