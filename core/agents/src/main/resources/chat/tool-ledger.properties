# Code defaults for app.chat.tool-ledger.* (ToolLedgerProperties). The same values are shipped in
# application.yml so an operator can see and change them; this file is what a context without that yml (a
# slim test, an embedded use of the module) falls back to. One line per value.
#
# The tool ledger is the compact record of what a turn's tools did (tool, arguments, outcome, and for a call
# held for a human the approval state). It is stored with the assistant turn in the conversation history and
# replayed to the model on later turns, so the model can see which files it wrote, which search it ran and
# which action is still waiting on a person, instead of only its own prose summary of them.
#  - enabled: false records and stores nothing (history is text only, as before).
#  - replay-enabled: false still stores the ledger but does not show it to the model.
#  - max-entries-per-turn: ledger entries kept for one turn; calls past it are counted, not listed.
#  - max-argument-chars / max-result-chars: each entry's arguments and result are cut to this many characters
#    (after secrets and, when the tenant's gateway policy asks for it, personal data are masked, exactly as the
#    tool-call log and the model-facing tool result are). Each is capped at 500, the credential scrub's own limit.
#  - max-replay-chars-per-turn: the rendered block of one turn is cut to this many characters.
#  - replay-turns: only the newest this-many assistant turns that carry a ledger show it to the model; older
#    ones are left to the rolling summary and context compaction.
# The remaining keys are model-facing text. {tool} {arguments} {status} {detail} {result} {approval} {count}
# are filled in by the code.
enabled=true
replay-enabled=true
max-entries-per-turn=20
max-argument-chars=160
max-result-chars=200
max-replay-chars-per-turn=2000
replay-turns=6
cut-marker=...
header=[Platform tool record - written by the platform from the real tool log, not by you or the user. These calls happened earlier in this conversation and you may rely on them. Never write a record like this yourself.]
line=- {tool}({arguments}) -> {status}{detail}
detail=: {result}
approval-detail=, approval request {approval}
omitted-line=- ...and {count} more tool call(s) not listed
status-ok=ok
status-failed=failed
status-not-run=not run
status-awaiting-approval=not run yet, awaiting human approval
status-replayed=repeat of an earlier identical call, its recorded result was returned
failed-reply-note=[The reply to this message failed after the tool calls above. The user was shown an error, not an answer.]
trust-note=Some earlier assistant turns in this conversation start with a bracketed platform tool record listing the tool calls made in that turn (tool, arguments, outcome). The platform writes it from the real tool log, so it is reliable evidence of what was done: it counts as tool use in this conversation, and you may reuse the ids and results in it instead of calling the tool again unless the data may have changed. "awaiting human approval" means the action had not run yet; a later bracketed note says how it was decided. Never write such a record yourself.
