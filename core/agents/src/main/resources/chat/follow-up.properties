# Code defaults for app.chat.follow-up.* (FollowUpProperties). The same values are shipped in
# application.yml so an operator can see and change them; this file is what a context without that yml (a
# slim test, an embedded use of the module) falls back to. One line per value.
#
# A short follow-up ("yes", "continue", "try again", "ok do it") carries no words to choose tools or a model
# by, so the turn is judged on the conversation instead of on the message:
#  - sticky-tools-enabled: keep on offer the tools this conversation already used (the tool-call log of this
#    session within sticky-tools-window, most recent first, at most max-sticky-tools), instead of cutting the
#    set down to the few that match the message. The tool set therefore stays stable through a task.
#  - short-message-chars: a message of at most this many characters (Unicode code points, after trimming) is a
#    follow-up. 0 turns the follow-up rules off.
#  - keep-primary-model: a follow-up in a conversation that already used tools is never sent to the agent's
#    economy model (cost routing); the model that started the task finishes it.
sticky-tools-enabled=true
short-message-chars=40
sticky-tools-window=PT2H
max-sticky-tools=12
keep-primary-model=true
