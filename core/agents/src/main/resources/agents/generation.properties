# Code defaults for app.agents.* generation limits (AgentGenerationProperties). The same values are shipped in
# application.yml so an operator can see and change them; this file is what a context without that yml
# (a slim test, an embedded use of the module) falls back to. One line per value.
#
#  - max-tokens-ceiling: the most output tokens ("max tokens", the length of one reply) an agent may be given.
#    ONE definition for every place that bounds it: creating an agent, updating its generation parameters
#    (a value above it is a 400), the Simple-mode tuning that infers a value from the system prompt, and the
#    hosted-pool token reservation (a stored value above it is reserved as this ceiling, so an agent stored
#    before the ceiling was lowered cannot reserve more than the ceiling). Raising it lets agents ask for
#    longer replies and makes one hosted-pool turn reserve more of the tenant's monthly token budget.
#  - inferred-max-tokens-floor: the least value the Simple-mode tuning will propose for an agent.
max-tokens-ceiling=8192
inferred-max-tokens-floor=128
