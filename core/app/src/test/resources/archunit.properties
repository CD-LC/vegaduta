# ArchUnit configuration for core/app tests (ADR-0011 phase 1).
# Any key can be overridden per run with -Darchunit.<key>=<value>.

# FreezingArchRule baseline: violations that existed when a rule was introduced.
# Path is relative to the surefire working directory (core/app).
freeze.store.default.path=src/test/resources/archunit_store
# A rule with no stored baseline FAILS instead of silently recording one.
# Creating a baseline for a new rule is an explicit, reviewed act:
#   -Darchunit.freeze.store.default.allowStoreCreation=true
freeze.store.default.allowStoreCreation=false
# Fixed violations are removed from the store automatically (it may only shrink).
freeze.store.default.allowStoreUpdate=true

# Report every cycle and every dependency on each cycle edge, so frozen cycle
# descriptions are complete and deterministic (defaults truncate at 100 / 20).
cycles.maxNumberToDetect=1000
cycles.maxNumberOfDependenciesPerEdge=1000
