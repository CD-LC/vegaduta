# Code defaults for app.agent-turn.repair.* (AgentTurnRepairProperties). The same values are shipped in
# application.yml so an operator can see and change them; this file is what a context without that yml
# (a slim test, an embedded use of the module) falls back to. One line per value.
#
# The *-message values are model-facing: they are the tool RESULTS the platform hands the model when a
# tool call it made arrived with arguments that cannot be used, so it can send the call again. They are
# written in the platform's voice, not the user's. Placeholders: {tool}, {reason} (invalid-reason-cut-off
# or invalid-reason-malformed).
max-attempts=1
invalid-arguments-message=This call to '{tool}' was NOT executed: its arguments were {reason}. Send the call again with complete, valid JSON arguments.
skipped-message=This call to '{tool}' was NOT executed because another tool call in the same reply had unusable arguments. Make the call again if it is still needed.
invalid-reason-cut-off=cut off because the reply reached the output length limit
invalid-reason-malformed=not valid JSON
unusable-calls-notice=The model's tool call could not be used: {tool} had arguments that were {reason}, so nothing was run. Ask for the step again, or break the task into smaller steps.
