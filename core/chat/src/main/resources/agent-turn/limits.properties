# Code defaults for app.agent-turn.limits.* (AgentTurnLimitsProperties). The same values are shipped in
# application.yml so an operator can see and change them; this file is what a context without that yml
# (a slim test, an embedded use of the module) falls back to. One line per value.
#
# Bounds on ONE request to POST /api/completions/agent-turn. A client-side agent conversation is large, so
# these bound a request, not a task. A request over a bound is answered 400 (413 for the size bound) before
# anything is reserved or any model is called.
#  - max-messages: messages in the conversation.
#  - max-total-chars: characters of message content in the whole conversation.
#  - max-tools: tool definitions the client offers.
#  - max-tool-calls-per-message: tool calls on one assistant message.
max-messages=400
max-total-chars=600000
max-tools=40
max-tool-calls-per-message=32
