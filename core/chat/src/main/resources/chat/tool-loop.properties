# Code defaults for app.chat.tools.* (ToolLoopProperties). The same values are shipped in application.yml
# so an operator can see and change them; this file is what a context without that yml (a slim test, an
# embedded use of the module) falls back to. One line per value.
#
# max-rounds-per-invocation: 0 follows the per-turn call ceiling (app.guardrails.max-tool-calls-per-turn,
# at the highest autonomy tier), so the round cap never ends a turn before the call ceiling does.
# The two *-message / *-reply values and restore-hint are model-facing or user-facing text.
# budget-exhausted-message: {rounds} is how many tool rounds this reply has used.
max-rounds-per-invocation=0
max-unknown-calls-per-invocation=8
budget-exhausted-message=Tool budget for this reply is exhausted after {rounds} tool round(s), so this call was NOT executed. Do not call any more tools. Answer the user now using only what you already have, and say briefly if anything is incomplete.
hard-stop-reply=I had to stop here: this request needed more tool calls than a single reply is allowed to make. Please narrow the request, or ask me to continue from where I left off.
restore-hint=call the tool again if you need this result
