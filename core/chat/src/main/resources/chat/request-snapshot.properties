# Code defaults for app.llm.request-snapshot.* (LlmRequestSnapshotProperties). The same values are shipped in
# application.yml so an operator can see and change them; this file is what a context without that yml
# (a slim test, an embedded use of the module) falls back to. One line per value.
#
# The LLM request inspector keeps a redacted, capped copy of recent model requests (in memory only) so the
# playground and workflow runs can show what was actually sent. These are the caps on ONE copy; the copy is
# for display only and never changes what the model receives.
#  - max-message-chars: characters of one message kept.
#  - max-total-chars: characters of all messages kept.
#  - max-schema-chars: characters of one tool's input schema kept.
#  - max-tools: tool definitions kept.
#  - max-call-chars: characters of one tool call's arguments / one tool result line kept.
#  - truncation-marker: appended to a message that was cut (shown to the person reading the inspector).
max-message-chars=40000
max-total-chars=300000
max-schema-chars=4000
max-tools=200
max-call-chars=600
truncation-marker=\n… [truncated for display]
