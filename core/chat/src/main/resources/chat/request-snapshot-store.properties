# Code defaults for app.llm.request-snapshot-store.* (LlmRequestSnapshotStoreProperties). The same values are shipped in
# application.yml so an operator can see and change them; this file is what a context without that yml
# (a slim test, an embedded use of the module) falls back to. One line per value.
#
# Where the LLM request inspector keeps the redacted copies of recent model requests.
#  - mode: redis = every copy is also written to Redis (the same Redis the rate limiter uses), so any replica can answer
#          "what was sent" for a turn another replica ran, and the copies outlive a restart for ttl; memory = this JVM only
#          (the pre-2026-10 behaviour). With redis and Redis unreachable the store falls back to memory and says so in the log.
#  - ttl: how long a copy is kept, in memory and in Redis.
#  - max-sessions: sessions kept in memory (least recently used leave first).
#  - max-per-session: model calls kept per session, in memory and in Redis.
#  - write-queue-size: copies waiting to be written to Redis; when full the oldest waiting copy is dropped from Redis
#          (it stays in memory on the replica that took it), so a slow Redis never slows a model call.
#  - key-prefix: Redis key prefix; the key is prefix + tenant + "|" + session.
mode=redis
ttl=PT6H
max-sessions=300
max-per-session=80
write-queue-size=256
key-prefix=agentic:llm-request-snapshots:
