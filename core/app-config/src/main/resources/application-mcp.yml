# Stage 4: MCP client configuration - active only under the "mcp" profile.
#
# Kept out of the base application.yml deliberately: the Stage 1-3 baseline
# already works and has been debugged end-to-end - bringing in a subprocess-
# launching MCP server (npx, first run downloads the package over the
# network) into that same startup path risks regressing something that's
# already proven, for a feature that's genuinely new and separately
# testable. Activate explicitly once ready to test Stage 4:
#
#   mvn spring-boot:run -Dspring-boot.run.profiles=mcp
#
# First run needs internet access - npx fetches @modelcontextprotocol/server-filesystem
# from the npm registry the first time it's invoked, which adds a one-time delay.
#
# Real incident, not a hypothetical: with the defaults (initialized: true,
# request-timeout: 20s), a slow/first-run npx invocation makes
# McpClientAutoConfiguration.mcpSyncClients() - a normal, eagerly-instantiated
# Spring bean - block for the full 20s, hit TimeoutException, and throw. Spring's
# bean creation is fatal-by-default: that one subprocess timing out took down
# the ENTIRE application context, so login/chat/admin/everything stopped
# working just because the "mcp" profile was active, even though nothing else
# in the app depends on this specific filesystem tool. Two independent
# mitigations below, not just one - a longer timeout alone still leaves a
# single flaky subprocess able to fail the whole app:
#   1. initialized: false - MCP clients connect lazily on first real use
#      instead of during application startup, so a slow/broken filesystem MCP
#      server can no longer block or crash context refresh.
#   2. request-timeout raised from Spring AI's 20s default to 60s - still
#      generous enough to cover a genuine cold npx download once a client
#      does connect (lazily or otherwise).
#
# "Enable all the MCP servers" (direct feedback) - McpCatalogService.CATALOG
# lists every server the "MCP Tools" gallery shows, but only a server with a
# real [connections.<name>] block *here* ever actually starts as a
# subprocess; clicking "Add" in the UI only writes a per-tenant DB row
# (McpRegistryService/McpServerRegistration) recording that this tenant
# *wants* it - see AgentToolProvider's javadoc: an agent only gets a given
# MCP tool when BOTH (a) this profile is active and the server is wired
# below AND (b) at least one tenant has enabled it via the UI. Those are two
# independent gates by design (this file is "what the whole deployment can
# possibly run," the DB toggle is "which of that this tenant actually
# wants"), and that's exactly why clicking "Add" alone was never enough to
# make Brave search (or anything else beyond filesystem) work - nothing had
# ever added its connection block here.
#
# Below are every catalog entry that needs ZERO external credentials
# (McpCatalogEntry.requiredEnvVars() is empty) - memory, sequential-thinking,
# puppeteer - wired the same way filesystem already was, so they're real the
# moment this "mcp" profile is active. The remaining catalog entries
# (brave-search, github, postgres, slack, gitlab, google-maps, google-drive,
# sqlite, sentry) each need a real third-party credential (BRAVE_API_KEY,
# GITHUB_PERSONAL_ACCESS_TOKEN, etc.) that only the deployment operator has -
# those can't be filled in here without a real key, so they're intentionally
# left out; add a connections.<name> block using the exact YAML
# McpCatalogService already shows for that entry (or GET
# /api/mcp/registry/catalog) once you have the credential, then restart core
# with this profile active.
#
# Direct feedback: "its enabled and not picking this is the issue with
# other mcp also" - root cause traced to core.log: "fetch" and "time" are
# NOT actually deliberately excluded here anymore. They used to be, and both
# were WRONG - @modelcontextprotocol/server-fetch and
# @modelcontextprotocol/server-time have never existed on the npm registry
# (confirmed via the real failure: "npm ERR! code E404 ... 404 Not Found").
# The official reference "fetch" and "time" MCP servers are Python packages
# run via `uvx mcp-server-fetch` / `uvx mcp-server-time`, not Node packages
# run via npx - this platform's static wiring here only ever spawns npx, so
# neither could ever have worked. Worse than just "these two don't work":
# spring-ai's SyncMcpToolCallbackProvider.getToolCallbacks() discovers every
# connection in this ONE map together and throws on the first failure (see
# AgentToolProvider#resolveStaticMcpTools's javadoc on this exact risk) - a
# 404'd fetch/time subprocess was silently taking memory, sequential-
# thinking, AND puppeteer down with it too, which is the "other mcp also"
# part of that feedback. Removed rather than "fixed to use uvx" because that
# would trade a guaranteed-broken failure for a maybe-broken one (uvx isn't
# installed on this machine, unlike npx/Node) - re-add either one yourself,
# with `command: uvx` / `args: ["mcp-server-fetch"]` (or `mcp-server-time`),
# once you have `uv` installed, ideally as its own isolated dynamic
# registration (Tools page -> Add, with that command/args) rather than back
# in this shared static block, so a bad connection can only ever take
# itself down.
#
# CROSS-TENANT ISOLATION (2026-09-28 - read before adding a server here):
# every connection below is ONE subprocess for the WHOLE container, shared by
# every tenant (the Docker image enables this "mcp" profile). That is only
# safe for a STATELESS server. The stateful ones are a cross-tenant data
# channel: filesystem reads/writes one shared ${MCP_FILESYSTEM_ROOT} root,
# memory keeps one shared knowledge graph, puppeteer/playwright-vision keep
# one shared browser (tabs, cookies, logged-in sessions) - tenant A's agent
# could read what tenant B's agent stored. So agents are only offered static
# servers named in app.mcp.static.stateless-servers (an ALLOWLIST - a server
# you add here is HIDDEN until you decide it is stateless and list it), unless
# the admin platform setting platform.mcp.static.shared-stateful-enabled=true
# (fallback: app.mcp.static.shared-stateful-enabled) - meant only for
# single-tenant/self-hosted deployments. Hidden servers are filtered before
# discovery, so their lazy subprocess never starts; core logs the hidden list
# once at startup. Tenants that want filesystem/memory/browser tools register
# their OWN isolated copy via the Tools page (dynamic, per-tenant
# connections - unaffected). See StaticMcpExposurePolicy.
app:
  mcp:
    static:
      # Comma-separated connection names (NOT a YAML list - read via @Value).
      stateless-servers: ${MCP_STATIC_STATELESS_SERVERS:sequential-thinking}
      shared-stateful-enabled: ${MCP_STATIC_SHARED_STATEFUL_ENABLED:false}
spring:
  ai:
    mcp:
      client:
        initialized: false
        request-timeout: 60s
        # WHERE THESE RUN (2026-09-29 image split): with MCP_STDIO_SIDECAR_ENABLED=true
        # every connection below is relayed to mcp-stdio-runner (same names, same
        # exposure policy - see StaticMcpStdioSidecarRouting); the browser ones need
        # the mcp-stdio-runner-browser image. With it false they spawn inside core,
        # which then needs the core-full image (core/Dockerfile MCP_TOOLCHAIN=full) -
        # the slim default image fails startup with a clear message instead
        # (McpStdioLauncherPreflight).
        stdio:
          connections:
            # STATEFUL (one shared file root) - hidden from agents by default, see CROSS-TENANT ISOLATION above.
            filesystem:
              # Windows: ProcessBuilder calls Windows' CreateProcess directly, which
              # (unlike cmd.exe) does not resolve extensionless commands via PATHEXT.
              # npm installs npx as npx.cmd on Windows, not npx.exe, so the literal
              # name "npx" fails to spawn there with no useful error surfaced by the
              # MCP client - only a generic "Client failed to initialize". Override
              # via MCP_FILESYSTEM_COMMAND=npx.cmd (PowerShell: $env:MCP_FILESYSTEM_COMMAND
              # = "npx.cmd") on Windows. Linux/Mac/Docker keep the default "npx".
              command: ${MCP_FILESYSTEM_COMMAND:npx}
              args:
                - "-y"
                - "@modelcontextprotocol/server-filesystem"
                - "${MCP_FILESYSTEM_ROOT:./mcp-data}"
            # STATEFUL (one shared knowledge graph) - hidden from agents by default, see CROSS-TENANT ISOLATION above.
            memory:
              command: ${MCP_MEMORY_COMMAND:npx}
              args:
                - "-y"
                - "@modelcontextprotocol/server-memory"
            # Stateless - on the default app.mcp.static.stateless-servers allowlist.
            sequential-thinking:
              command: ${MCP_SEQUENTIAL_THINKING_COMMAND:npx}
              args:
                - "-y"
                - "@modelcontextprotocol/server-sequential-thinking"
            # STATEFUL (one shared browser) - hidden from agents by default, see CROSS-TENANT ISOLATION above.
            puppeteer:
              command: ${MCP_PUPPETEER_COMMAND:npx}
              args:
                - "-y"
                - "@modelcontextprotocol/server-puppeteer"
            # Master-Roadmap-2026.md item #10 ("Vision-driven browser
            # automation upgrade") - Microsoft's official @playwright/mcp run
            # with --caps=vision, giving agents a screenshot + pixel-
            # coordinate click/drag fallback for sites where puppeteer's
            # DOM-selector approach above breaks down. See
            # McpCatalogService's playwright-vision entry for the full
            # rationale on why this is additive, not a replacement.
            # STATEFUL (one shared browser) - hidden from agents by default, see CROSS-TENANT ISOLATION above.
            playwright-vision:
              command: ${MCP_PLAYWRIGHT_VISION_COMMAND:npx}
              args:
                - "-y"
                # PINNED, not @latest - core/Dockerfile (MCP_TOOLCHAIN=full) and
                # services/mcp-stdio-runner/Dockerfile (WITH_BROWSERS=true) install this exact
                # version's own required browser at build time (a live
                # 2026-08-09 incident traced a browser-not-found failure to
                # @latest here resolving a newer playwright-core than the
                # image's build-time install used, expecting a browser
                # revision that was never downloaded). Bump this AND the
                # Dockerfile's install-browser line together, deliberately -
                # never let this float back to @latest.
                - "@playwright/mcp@0.0.83"
                - "--caps=vision"
                # Without this, @playwright/mcp defaults to hunting for the
                # BRANDED Google Chrome channel at a hardcoded path no Docker
                # base image ships - see core/Dockerfile's Chromium
                # install step for the matching build-time half of this fix.
                - "--browser=chromium"
                # Leak mitigation (2026-08-09/10 incident: this one shared
                # stdio connection is a Spring-managed singleton for the
                # WHOLE container's lifetime, reused by every tenant's every
                # turn - a live prod host was found with 18+ orphaned
                # renderer processes from one never-restarted browser,
                # several GB, because nothing ever tears the browser down
                # between turns). --isolated makes the server use a fresh,
                # in-memory browser context instead of a persistent on-disk
                # profile (the leaked profile dir was
                # ms-playwright-mcp/mcp-chrome-for-testing-<hash> under this
                # container's home dir) - this does NOT by itself close tabs
                # opened during the container's current uptime (that needs a
                # verified-safe restart/reaper mechanism, deliberately not
                # shipped yet - see the same incident's notes in
                # docs/AGENT-COORDINATION-2026-07-18.md for why: the MCP
                # Java SDK's exact respawn behavior after this bean's
                # subprocess dies is unverified, and AgentToolProvider.java's
                # own comment on this exact connection documents the stdio
                # transport "only tolerates ONE subscriber... a second
                # concurrent call crashed instead of just being slow", so a
                # naive scheduled restart risks trading a slow leak for an
                # occasional live crash for a real tenant). It DOES mean a
                # future container restart (redeploy, OOM, crash) starts
                # genuinely clean instead of reopening a stale profile with
                # whatever tab/session state was last written to disk.
                - "--isolated"
