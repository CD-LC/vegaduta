# Code defaults for app.guardrails.step-limit.* (ToolStepLimitProperties). The same values are shipped in
# application.yml so an operator can see and change them; this file is what a context without that yml
# (a slim test, an embedded use of the module) falls back to. One line per value.
#
# The ceiling itself is app.guardrails.max-tool-calls-per-turn; these say what happens past it and how the
# agent's autonomy tier scales it. exhausted-message is model-facing: it is the tool result for every call
# made after the ceiling, and {limit} is the ceiling that applied.
grace-calls=10
supervised-divisor=2
supervised-min-steps=3
autonomous-multiplier=2
exhausted-message=Tool budget for this reply is exhausted: {limit} tool call(s) have been made, so this call was NOT executed. Do not call any more tools. Answer the user now using only what you already have, and say briefly what is incomplete and what you would do next.
