# Code defaults for app.guardrails.approval-park.* (ApprovalParkProperties). The same text is
# shipped in application.yml so an operator can see and change it; this file is what a context
# without that yml (a slim test, an embedded use of the module) falls back to. One line per value.
# {tool}, {requestId} and {parkedTool} are filled in per call.
max-queued-calls=5
max-goal-chars=4000
goal-cut-marker=\ [...message shortened]
awaiting-message=This action ('{tool}') requires human approval before it can run and was NOT executed. An approval request ({requestId}) has been sent to a tenant-admin. Once it is approved the action runs automatically with these exact arguments, and your task is resumed automatically with its result, so do not retry the action yourself and do not claim it was done. Your goal has not changed and you are not finished: you are waiting on this approval. Briefly tell the user what is waiting for approval, then end this turn without calling more tools; nothing else runs in this turn until the human has decided.
queued-message=This tool call ('{tool}') was NOT executed: an earlier action in this turn ('{parkedTool}') is waiting for human approval, and nothing else runs until it is decided. This call has been queued as its own approval request ({requestId}) and will run once it is approved, so do not repeat it. Your goal has not changed: your task is resumed automatically after the approvals are decided. Briefly tell the user what is waiting, then end this turn without calling more tools.
queue-full-message=This tool call ('{tool}') was NOT executed and was not queued: an earlier action in this turn ('{parkedTool}') is waiting for human approval and enough follow-up calls are already queued behind it. Do not call more tools. Your goal has not changed: briefly tell the user what is waiting for approval and end this turn; your task is resumed automatically once the approvals are decided.
record-failed-message=This action ('{tool}') requires human approval, but the approval request could not be recorded, so it was NOT executed and nothing is waiting for approval. Do not retry it. Tell the user plainly that the action could not be submitted for approval and that they can ask again, then carry on with any part of the task that does not need this action.
