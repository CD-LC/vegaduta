# Code defaults for app.tools.output.* (ToolOutputProperties). The same values are shipped in
# application.yml so an operator can see and change them; this file is what a context without that yml
# (a slim test, an embedded use of the module) falls back to. One line per value.
#
# max-chars is the most characters ONE tool result may hand to the model, marker included. A longer
# result is cut and ends with truncation-marker. {total} is the original length, {dropped} how much was
# cut and {limit} the cap that applied; the text is model-facing.
max-chars=20000
truncation-marker=\n...[truncated: {dropped} of {total} characters were cut because this tool result is over the {limit}-character limit. If you need the rest, call the tool again with a narrower request (a smaller range, a filter or an offset).]
