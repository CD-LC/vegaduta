# Code defaults for app.agents.collaboration.* (CollaborationProperties). The same values are shipped in
# application.yml so an operator can see and change them; this file is what a context without that yml
# (a slim test, an embedded use of the module) falls back to. One line per value.
#
# Bounds on the parallel fan-out tools: delegate_parallel (a team of collaborators) and run_subtasks (throwaway
# copies of the calling agent). Both run their branches in parallel on virtual threads inside ONE tool call.
#  - max-branches: branches one call may start; briefs past it come back as "over the limit" entries.
#  - branch-timeout-seconds: wall-clock limit of one branch; a hung branch becomes a timeout entry instead of
#    holding the turn.
#  - max-answer-chars: characters of one branch's answer handed back to the calling model (a longer one is cut
#    and marked), which keeps the combined result inside the caller's context budget.
#  - max-role-chars: characters kept of a run_subtasks worker's role label.
max-branches=8
branch-timeout-seconds=240
max-answer-chars=4000
max-role-chars=80
