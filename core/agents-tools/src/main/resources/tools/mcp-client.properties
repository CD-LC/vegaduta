# Code defaults for app.tools.mcp.* (McpClientProperties). The same values are shipped in application.yml so an
# operator can see and change them; this file is what a context without that yml (a slim test, an embedded use
# of the module) falls back to. One line per value.
#
# Timeouts of the MCP client a tenant's registered (dynamic) MCP servers are called through.
#  - request-timeout-seconds: how long ONE request to a connected MCP server (a tool call, tools/list, the
#    initialize handshake, a health check) may wait for the reply before the SDK gives up on it.
#  - test-timeout-seconds: the same limit for the explicit "test connection" action, which is shorter on
#    purpose: a person is waiting on it in the console.
request-timeout-seconds=60
test-timeout-seconds=20
