# Code defaults for app.tools.openapi.* (OpenApiToolProperties). The same values are shipped in application.yml
# so an operator can see and change them; this file is what a context without that yml (a slim test, an embedded
# use of the module) falls back to. One line per value.
#
# Limits of the HTTP calls the platform makes for a tenant's OpenAPI tool sources: fetching the spec, minting an
# OAuth2 token, and calling the API a tool stands for. Every call goes through the SSRF-guarded client.
#  - connect-timeout-seconds / request-timeout-seconds: how long a call may take to connect, and to get its reply.
#  - max-response-bytes: bytes of an API reply that are read; the rest is dropped.
#  - max-result-chars: characters of an API reply handed to the model; a longer one is clipped and marked so.
#  - max-spec-redirects: redirects followed when fetching a spec (each hop is re-checked against the SSRF guard).
connect-timeout-seconds=10
request-timeout-seconds=30
max-response-bytes=1048576
max-result-chars=16000
max-spec-redirects=3
