# Documentation site, built from docs/ and published to GitHub Pages by
# .github/workflows/docs.yml. Local preview: `make docs-serve` (creates a venv
# from docs/requirements.txt). The Markdown under docs/ stays readable on GitHub
# without this file; nothing here is required to read the docs.
site_name: VegaDūta documentation
site_description: Open-source platform for building, governing and running AI agents, and the Java Agent SDK.
site_url: https://cd-lc.github.io/vegaduta/
repo_url: https://github.com/CD-LC/vegaduta
repo_name: vegaduta
edit_uri: edit/main/docs/
copyright: BSL-1.1 (sdk/ stays Apache-2.0). Where a page disagrees with the code, the code wins.

docs_dir: docs
site_dir: site
exclude_docs: |
  requirements.txt
  plans/adr/README.md

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite

plugins:
  - search

# scripts/docs/mkdocs_hooks.py: embeds files from outside docs/ (a line `--8<-- "sdk/java/README.md"`)
# and rewrites relative links that leave docs/ to their GitHub URLs, so the Markdown stays
# correct on GitHub and on this site.
hooks:
  - scripts/docs/mkdocs_hooks.py

validation:
  nav:
    omitted_files: ignore

