# Account Console theme override (task #960 "consistent theme across
# Login/Forgot Password/Registration/Account pages" - the Account Console
# is its own Keycloak theme TYPE ("account"), not "login", so it needs its
# own theme directory here rather than living under themes/agentic-ai/login/
# the way login-reset-password.ftl/register.ftl do.
#
# Keycloak 25 (this project's pinned version - see the `image:` line in
# deploy/docker-compose.yml's keycloak service) ships its Account Console
# as "keycloak.v3": a compiled React/PatternFly 5 single-page app, not a
# set of FreeMarker templates the way the "keycloak" login base theme is.
# That means the pixel-to-pixel split-screen rebuild login.ftl/template.ftl
# do for the login theme isn't available here - there's no per-page .ftl
# to override the way login.ftl overrides the base theme's login form
# markup, and no template.ftl-equivalent shared shell to re-skin structurally.
#
# The supported customization surface for a theme parented on keycloak.v3
# is CSS only (the "styles" property below loads an extra stylesheet into
# the SPA's own page). account.css therefore reskins background/text/
# accent colors and fonts to match the login theme's --aai-* tokens
# (copied as literal hex, same convention login.css's own header comment
# already established for pulling in signup.css's tokens, since CSS custom
# properties can't be shared across theme TYPES any more than across
# origins/build systems) via overrides against PatternFly's own
# --pf-v5-global-*/--pf-global-* design tokens, plus a few hard fallback
# selectors on html/body in case the exact PatternFly token names this
# Keycloak version's account console build resolves against don't match
# every override below - so it degrades to "same background/text/accent
# colors, not full pixel parity with login" rather than "no effect at all"
# if some component doesn't pick up a given token override.
#
# import=common/keycloak (which login/theme.properties uses) is deliberately
# NOT included here - that import pulls in the old PatternFly-3 shared
# resources (images/patternfly.min.css etc) the "keycloak" login base theme
# uses, which the compiled React account console never loads or needs.
parent=keycloak.v3

styles=css/account.css

# Header brand: keycloak.v3's page header renders
# ${resourceUrl}/${logo} linked to logoUrl (empty -> stock Keycloak logo).
# vegaduta-lockup.png = winged emblem + light wordmark for the dark header.
# brand-banner.js makes a plain click on it open the same animated brand
# banner as the admin/tenant consoles; modified clicks still follow logoUrl.
logo=img/vegaduta-lockup.png
# Keycloak resolves ${env.VAR:default} in theme.properties (same as login/email).
logoUrl=${env.PUBLIC_APP_URL:http://localhost:3000}/
scripts=js/brand-banner.js
