# Custom login theme for the agentic-ai realm (agentic-ai-realm.json sets
# "loginTheme": "agentic-ai", so every hosted Keycloak screen - login,
# register, forgot password, OTP, error - picks this up automatically).
#
# Parented on Keycloak's "keycloak" theme (not keycloak.v2): its property
# names (kcInputClass, kcButtonClass, kcFormGroupClass ...) and the
# user-profile / password-visibility macros have stayed stable across major
# releases, so this theme stays a template + CSS override rather than a
# fork. stylesCommon (PatternFly) is inherited on purpose: pages this theme
# does not override still get a baseline, and css/login.css resets what
# fights the paper-and-ink design.
#
# "paper & ink + glass" restyle (2026-09-24) - template.ftl is the shared
# shell (one centred glass card on a paper page, emblem + wordmark, footer);
# every page file only supplies its eyebrow/title/subtitle/form. Field
# ids/names are Keycloak's own everywhere, so validation, OTP, WebAuthn,
# social login and required actions keep working unchanged.
parent=keycloak
import=common/keycloak

# Loaded in this order, which is the cascade order (tokens/page/card first).
styles=css/login.css css/login-fields.css css/login-actions.css

# Show/hide password toggle: Keycloak's passwordVisibility.js swaps the <i>
# class between these two; login-fields.css draws them as inline SVG masks so the
# theme does not depend on Font Awesome loading.
kcFormPasswordVisibilityIconShow=aai-eye-show
kcFormPasswordVisibilityIconHide=aai-eye-hide

# Deployment links (Keycloak resolves ${env.VAR:default} in theme.properties).
# PUBLIC_APP_URL is passed to the keycloak container by deploy/compose/*.yml.
aaiAppUrl=${env.PUBLIC_APP_URL:http://localhost:3000}
aaiPrivacyUrl=${env.THEME_PRIVACY_URL:https://github.com/CD-LC/vegaduta/blob/main/SECURITY.md}
aaiTermsUrl=${env.THEME_TERMS_URL:https://github.com/CD-LC/vegaduta/blob/main/LICENSE}
aaiHelpUrl=${env.THEME_HELP_URL:https://github.com/CD-LC/vegaduta}
