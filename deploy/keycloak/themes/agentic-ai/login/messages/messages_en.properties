# Copy this theme introduces on top of Keycloak's stock English bundle
# (parent=keycloak): eyebrows, titles, subtitles, button labels and the
# footer. Field labels, validation errors and anything not listed here still
# come from Keycloak's own bundle. (A literal apostrophe is '' - MessageFormat.) A messages_hi.properties (etc) next to
# this file is how a later pass localises these; an untranslated locale would
# otherwise print the raw key, since none of these exist in the stock bundle.

# --- shared shell (template.ftl) ---
aaiFootSecured=Secured by Keycloak
aaiFootPrivacy=Privacy
aaiFootTerms=Terms
aaiFootHelp=Help

# --- login.ftl ---
aaiEyebrowSignIn=Sign in
aaiWelcomeBack=Welcome back
aaiWelcomeBackSubtitle=Sign in to your VegaDūta workspace.
aaiContinueWith=Continue with {0}
aaiOrWithEmail=or with email
aaiNoAccount=New to VegaDūta?
aaiCreateAccount=Create account
# Fallbacks only - login.ftl prefers the calling client's baseUrl, and
# info.ftl/error.ftl use these when no redirect/action/baseUrl exists at all
# (e.g. the bare "email verified" landing). Prod is .ai.
aaiSignupUrl=/signup
aaiLoginUrl=/login

# --- register.ftl ---
aaiEyebrowRegister=Create account
aaiRegisterTitle=Create your account
aaiCreateAccountSubtitle=Set up your VegaDūta workspace login.
aaiHaveAccount=Already have an account?

# --- login-reset-password.ftl ---
aaiEyebrowReset=Reset password
aaiForgotPasswordTitle=Reset your password
aaiForgotPasswordSubtitle=We''ll email you a link to reset your password.
aaiSendResetLink=Send reset link
aaiBackToSignIn=Back to sign in

# --- login-update-password.ftl ---
aaiEyebrowSecurity=Security
aaiUpdatePasswordSubtitle=Choose a new password for your VegaDūta account.
aaiSavePassword=Update password

# --- login-otp.ftl ---
aaiEyebrowTwoFactor=Two-factor
aaiOtpTitle=Two-factor verification
aaiOtpSubtitle=Enter the code from your authenticator app.
aaiVerify=Verify

# --- login-verify-email.ftl ---
aaiEyebrowVerifyEmail=Verify email
aaiVerifyEmailTitle=Check your inbox
aaiVerifyEmailSubtitle=One more step to secure your account.
# Shown in place of the address when the account has no email on file.
aaiYourEmailFallback=your registered email address
# Replaces the base theme's generic "Click here" (screen readers hit several
# identical-sounding links otherwise) - splices into emailVerifyInstruction2/3.
aaiResendVerificationEmail=resend the verification email

# --- login-update-profile.ftl ---
aaiEyebrowProfile=Your profile
aaiUpdateProfileTitle=Complete your profile
aaiUpdateProfileSubtitle=Keep your VegaDūta profile up to date.
aaiSaveChanges=Save changes

# --- login-page-expired.ftl / error.ftl / info.ftl ---
aaiEyebrowSession=Session
aaiPageExpiredSubtitle=This page took too long. Pick up where you left off below.
# Replace the base theme's generic "Click here" - two of these appear on the
# same page and read identically out of context for screen reader users.
aaiRestartLoginLink=restart the login process
aaiContinueLoginLink=continue the login process
aaiEyebrowError=Something went wrong
aaiErrorTitle=We couldn''t sign you in
aaiErrorSubtitle=Here is what happened.
aaiEyebrowInfo=Notice

# --- login-idp-link-confirm.ftl / login-idp-link-email.ftl / re-auth ---
# Shown when someone signs in with Google (or another social provider) using
# an email that already has a VegaDūta password account. Keycloak's default
# "User with email X already exists. How do you want to continue?" read like
# an error and gave no hint which button keeps their existing workspace.
# Deliberately still a prompt, not an automatic link:
# linking needs proof of the existing account - its password or an email link.
confirmLinkIdpTitle=You already have an account
federatedIdentityConfirmLinkMessage=There is already a VegaDūta account for {1}. Connect this sign-in to it to keep your workspace and agents.
confirmLinkIdpContinue=Connect to my existing account
aaiEyebrowLinkAccount=Connect accounts
aaiUseAnotherAccount=Sign in with a different account instead
federatedIdentityConfirmReauthenticateMessage=Enter your VegaDūta password once to connect {0} to your account. After that, {0} signs you straight in.
emailLinkIdpTitle=Confirm it''s you
emailLinkIdp1=We sent you an email with a link. Open it to connect your {0} account {1} to your existing {2} account.
