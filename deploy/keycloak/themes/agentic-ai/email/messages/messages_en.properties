# Custom email theme subjects for the Agentic AI Platform realm - only the
# keys this theme actually overrides are listed here; every other stock
# Keycloak email subject/body still comes from the parent "keycloak" email
# theme's own English bundle via parent=keycloak (email/theme.properties),
# matching the same "only override what changed" convention the login theme's
# messages_en.properties already uses.
#
# These three *Subject keys are read directly by Keycloak's mail-sending code
# (DefaultEmailSenderProvider) to build the "Subject:" header - they are NOT
# read from the html/text .ftl bodies, which is why they're overridden here
# rather than hardcoded in the templates.
emailVerificationSubject=Verify your VegaDūta email
passwordResetSubject=Reset your VegaDūta password
executeActionsSubject=Action required for your VegaDūta account
