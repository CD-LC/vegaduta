# Custom email theme for the Agentic AI Platform realm.
#
# The realm itself must set "emailTheme": "agentic-ai" (agentic-ai-realm.json,
# alongside the existing "loginTheme"/"accountTheme": "agentic-ai") for
# Keycloak to actually pick these templates - that realm-config edit is
# intentionally NOT made from here (out of this agent's scope; the realm
# JSON is owned elsewhere). Until that flag is set, Keycloak keeps sending
# its stock plain-text/basic-HTML emails even with this theme directory
# present on disk.
#
# parent=keycloak inherits every email Keycloak ships (event notifications,
# identity-provider link, OTP reset, etc.) so only the templates this theme
# actually overrides below need to exist here - everything else silently
# falls back to Keycloak's own default email theme, matching the same
# "only override what changed" convention the login/account theme.properties
# files in this repo already use.
parent=keycloak

# Absolute logo URL for HTML e-mails (served by the web console).
aaiLogoUrl=${env.PUBLIC_APP_URL:http://localhost:3000}/logo-mark.png
aaiWordmarkUrl=${env.PUBLIC_APP_URL:http://localhost:3000}/vegaduta-wordmark.png
