# =============================================================================
# VegaDūta LITE — minimal local mode (5 containers, sized for an 8 GB laptop)
#
#   ./scripts/vegaduta up --lite            # recommended
#   docker compose -f deploy/compose/lite.yml --env-file deploy/compose/.env up -d --wait
#
#   postgres  PostgreSQL 16 + pgvector + Apache AGE
#   valkey    Redis-protocol cache (BSD-3)
#   keycloak  identity, dev-file store (no separate DB), realm auto-imported
#   core      single Spring Boot process; profiles security,knowledge,
#             graph-memory,lite (no `workflow` => no Kafka/Temporal needed);
#             files on a local volume instead of S3
#   web       Next.js console
#
# Optional (scripts/vegaduta up --lite ...):
#   --profile rag        adds the Python sidecar (document ingestion,
#                        embeddings, rerank, transcription)
#   --profile workspace  workspace-runner: the Assistant's build terminal and
#                        the projects folder it works in (VEGADUTA_PROJECTS_DIR)
#
# On by default for a FRESH lite install (opt out with --no-search / --no-tools /
# --no-browser, or VEGADUTA_SEARCH=0 / VEGADUTA_TOOLS=0 / VEGADUTA_BROWSER=0 in .env):
#   --profile tools      mcp-stdio-runner: the container STDIO MCP servers
#                        (npx/uvx connectors) run in, away from core's secrets
#   --search             SearXNG web search (docker-compose.search*.yml)
#   --browser            the Assistant's own browser (deploy/compose/browser.yml):
#                        browser_* tools (navigate, screenshot, click, type)
#
# Upgrading to the full stack keeps the Postgres volume only if you reuse
# the same COMPOSE_PROJECT_NAME; Keycloak users (dev-file) and local files do
# NOT migrate automatically — see deploy/README.md.
# =============================================================================

name: ${COMPOSE_PROJECT_NAME:-vegaduta-lite}

x-restart: &restart
  restart: unless-stopped

# Bounded container logs. Docker's json-file driver is unbounded by default and
# has filled the host disk before; 3 x 10 MB per container caps it.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# Hardening (same meaning as in docker-compose.yml).
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]

x-nnp: &nnp
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: ${VEGADUTA_POSTGRES_IMAGE:-${VEGADUTA_REGISTRY:-ghcr.io/cd-lc}/postgres:${VEGADUTA_VERSION:?set VEGADUTA_VERSION to a release (e.g. 1.2.3) or use --build; run scripts/vegaduta secrets}}
    <<: [*restart, *logging, *nnp]
    # shared_preload_libraries=age: see docker-compose.yml (non-superuser AGE).
    command: ["postgres", "-c", "shared_preload_libraries=age", "-c", "max_connections=100", "-c", "shared_buffers=128MB"]
    environment:
      # Bootstrap SUPERUSER (db-roles, backups, you). core uses POSTGRES_APP_USER.
      POSTGRES_USER: ${POSTGRES_USER:-agentic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/vegaduta secrets}
      POSTGRES_DB: ${POSTGRES_DB:-agentic_ai}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 512m

  db-roles:
    # One-shot, idempotent: the least-privileged login core uses. See
    # deploy/postgres/ensure-app-role.sh and docker-compose.yml.
    image: ${VEGADUTA_POSTGRES_IMAGE:-${VEGADUTA_REGISTRY:-ghcr.io/cd-lc}/postgres:${VEGADUTA_VERSION:?set VEGADUTA_VERSION to a release (e.g. 1.2.3) or use --build; run scripts/vegaduta secrets}}
    <<: [*logging, *hardened]
    restart: "no"
    user: postgres
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["sh", "/ensure-app-role.sh"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-agentic}
      PGPASSWORD: ${POSTGRES_PASSWORD:?run scripts/vegaduta secrets}
      PGDATABASE: ${POSTGRES_DB:-agentic_ai}
      APP_DB_USER: ${POSTGRES_APP_USER:-vegaduta_app}
      APP_DB_PASSWORD: ${POSTGRES_APP_PASSWORD:?run scripts/vegaduta secrets}
    volumes:
      - ../postgres/ensure-app-role.sh:/ensure-app-role.sh:ro
    deploy:
      resources:
        limits:
          memory: 64m

  valkey:
    image: valkey/valkey:9.1.2-alpine
    <<: [*restart, *logging, *nnp]
    command:
      - sh
      - -c
      - printf 'requirepass %s\nmaxmemory 96mb\nmaxmemory-policy allkeys-lru\n' "$$VALKEY_PASSWORD" > /tmp/valkey.conf && exec valkey-server /tmp/valkey.conf
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?run scripts/vegaduta secrets}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${VALKEY_HOST_PORT:-6379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 128m

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    <<: [*restart, *logging, *nnp]
    # No KC_DB => Keycloak's embedded dev-file store, persisted in the volume.
    # start-dev is for this single-machine localhost mode ONLY; anything
    # reachable from other machines uses the full stack + domain overlay
    # (production-mode `start` against its own PostgreSQL).
    command: ["start-dev", "--import-realm"]
    environment: &keycloak-env
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run scripts/vegaduta secrets}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run scripts/vegaduta secrets}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: ${PUBLIC_AUTH_URL:-http://localhost:8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=65"
      # Consumed by the realm template's ${env.*} placeholders on first import.
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?run scripts/vegaduta secrets}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      PUBLIC_ADMIN_URL: ${PUBLIC_ADMIN_URL:-http://localhost:3000}
      KC_VERIFY_EMAIL: ${KC_VERIFY_EMAIL:-false}
      # Password grant on the confidential core client: off (first import only).
      # The CI overlay turns it on for the Playwright/smoke logins.
      KC_CORE_DIRECT_GRANTS: ${KC_CORE_DIRECT_GRANTS:-false}
      THEME_PRIVACY_URL: ${THEME_PRIVACY_URL:-https://github.com/CD-LC/vegaduta/blob/main/SECURITY.md}
      THEME_TERMS_URL: ${THEME_TERMS_URL:-https://github.com/CD-LC/vegaduta/blob/main/LICENSE}
      THEME_HELP_URL: ${THEME_HELP_URL:-https://github.com/CD-LC/vegaduta}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${KEYCLOAK_HOST_PORT:-8180}:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ../keycloak/agentic-ai-realm.json:/opt/keycloak/data/import/agentic-ai-realm.json:ro
      - ../keycloak/themes/agentic-ai:/opt/keycloak/themes/agentic-ai:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 768m

  # The realm file's ${env.*} placeholders substitute on import EXCEPT a client
  # `secret`, which lands as the literal "${env.KEYCLOAK_CLIENT_SECRET}" - every
  # admin-API call (tenant signup included) then fails 401. The CLI runs this
  # script after `up` (reconcile_keycloak); this one-shot makes a plain
  # `docker compose up` converge the same way. Idempotent; shares keycloak's
  # network namespace so the script's localhost:8080 is this realm's Keycloak.
  keycloak-reconcile:
    image: quay.io/keycloak/keycloak:26.7.5
    <<: [*logging, *nnp]
    restart: "no"
    network_mode: "service:keycloak"
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      <<: *keycloak-env
      REALM: ${KEYCLOAK_REALM:-agentic-ai}
      # The script takes short names; the CLI maps the same .env keys into them.
      SH: ${KEYCLOAK_SMTP_HOST:-}
      SP: ${KEYCLOAK_SMTP_PORT:-587}
      SF: ${KEYCLOAK_SMTP_FROM:-}
      SD: ${KEYCLOAK_SMTP_FROM_DISPLAY:-}
      SU: ${KEYCLOAK_SMTP_USER:-}
      SW: ${KEYCLOAK_SMTP_PASSWORD:-}
      ST: ${KEYCLOAK_SMTP_STARTTLS:-true}
      GGID: ${GOOGLE_CLIENT_ID:-}
      GGSEC: ${GOOGLE_CLIENT_SECRET:-}
      GHID: ${GITHUB_CLIENT_ID:-}
      GHSEC: ${GITHUB_CLIENT_SECRET:-}
      MSID: ${MICROSOFT_CLIENT_ID:-}
      MSSEC: ${MICROSOFT_CLIENT_SECRET:-}
    # /health/ready can flip a moment before the admin API serves; the script
    # is idempotent, so retry the login race rather than fail the boot.
    entrypoint:
      [
        "bash", "-c",
        "for i in $(seq 1 30); do bash /realm-reconcile.kcadm.sh && exit 0; sleep 5; done; exit 1",
      ]
    volumes:
      - ../keycloak/reconcile-realm.kcadm.sh:/realm-reconcile.kcadm.sh:ro

  core:
    # Slim image by default (no Node/uv/browsers). CORE_IMAGE_VARIANT=-full
    # selects core-full, needed only if you add ",mcp" to LITE_SPRING_PROFILES.
    image: ${VEGADUTA_REGISTRY:-ghcr.io/cd-lc}/core${CORE_IMAGE_VARIANT:-}:${VEGADUTA_VERSION:?set VEGADUTA_VERSION to a release (e.g. 1.2.3) or use --build; run scripts/vegaduta secrets}
    <<: [*restart, *logging, *hardened]
    # Read-only root FS; writable paths mirror the Helm core chart.
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
      - /home/agentic/.npm:size=1g,uid=999,gid=999,mode=0700
      - /home/agentic/.cache/uv:size=1g,uid=999,gid=999,mode=0700
      - /home/agentic/.vegaduta:size=1g,uid=999,gid=999,mode=0700
    depends_on:
      postgres:
        condition: service_healthy
      db-roles:
        condition: service_completed_successfully
      workspace-perms:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      sidecar:
        condition: service_healthy
        required: false
      mcp-stdio-runner:
        condition: service_healthy
        required: false
    env_file:
      - path: ./core.env
        required: false
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError -XX:+UseSerialGC -Djava.net.preferIPv4Stack=true"
      SPRING_PROFILES_ACTIVE: ${LITE_SPRING_PROFILES:-security,knowledge,graph-memory,lite}${CORE_PROFILES_EXTRA:-}
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-agentic_ai}
      # Least-privileged login (database owner, not a superuser); see db-roles.
      POSTGRES_USER: ${POSTGRES_APP_USER:-vegaduta_app}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:?run scripts/vegaduta secrets}
      REDIS_HOST: valkey
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${VALKEY_PASSWORD:?run scripts/vegaduta secrets}
      # NEVER change after first boot (stored secrets become undecryptable).
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?run scripts/vegaduta secrets}
      PLATFORM_MASTER_KEY: ${PLATFORM_MASTER_KEY:-}
      KEYCLOAK_ISSUER_URI: ${PUBLIC_AUTH_URL:-http://localhost:8180}/realms/${KEYCLOAK_REALM:-agentic-ai}
      KEYCLOAK_ADDITIONAL_ISSUERS: ${KEYCLOAK_ADDITIONAL_ISSUERS:-}
      # Lite has no SMTP, so a required "verify your email" step would end the first sign-up on
      # "Failed to send email". Set KEYCLOAK_REQUIRE_EMAIL_VERIFICATION=true once Keycloak can send mail.
      APP_KEYCLOAK_REQUIRE_EMAIL_VERIFICATION: ${KEYCLOAK_REQUIRE_EMAIL_VERIFICATION:-false}
      # Private hosts tenant-configured outbound calls may reach (e.g. ollama:11434).
      APP_SECURITY_OUTBOUND_ALLOWED_PRIVATE_HOSTS: ${APP_SECURITY_OUTBOUND_ALLOWED_PRIVATE_HOSTS:-}
      # Optional: register a local Ollama / OpenAI-compatible server as the FREE-tier pool at
      # startup (api shape only; see docs/configuration.md "Local LLM pool bootstrap").
      APP_LOCAL_LLM_BOOTSTRAP_ENABLED: ${APP_LOCAL_LLM_BOOTSTRAP_ENABLED:-false}
      APP_LOCAL_LLM_BOOTSTRAP_BASE_URL: ${APP_LOCAL_LLM_BOOTSTRAP_BASE_URL:-http://ollama:11434}
      APP_LOCAL_LLM_BOOTSTRAP_MODEL: ${APP_LOCAL_LLM_BOOTSTRAP_MODEL:-qwen3.5:4b}
      APP_LOCAL_LLM_BOOTSTRAP_LABEL: ${APP_LOCAL_LLM_BOOTSTRAP_LABEL:-Local model (Ollama)}
      APP_LOCAL_LLM_BOOTSTRAP_API_KEY: ${APP_LOCAL_LLM_BOOTSTRAP_API_KEY-ollama}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-agentic-ai}/protocol/openid-connect/certs
      KEYCLOAK_ADMIN_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-agentic-ai}
      KEYCLOAK_CLIENT_ID: agentic-ai-core
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?run scripts/vegaduta secrets}
      APP_WEB_PUBLIC_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      APP_WEB_ALLOWED_ORIGINS: ${PUBLIC_APP_URL:-http://localhost:3000},http://localhost:3000,http://127.0.0.1:3000
      # Local-disk file storage (application-lite.yml: app.storage.type=local).
      APP_STORAGE_TYPE: local
      APP_STORAGE_LOCAL_PATH: /data/storage
      SIDECAR_BASE_URL: http://sidecar:8001
      SIDECAR_SHARED_SECRET: ${SIDECAR_SHARED_SECRET:-}
      # The sidecar container only exists under --profile rag; the CLI exports
      # APP_SIDECAR_ENABLED=true with it. Without it: rerank fails open, PDF/OCR/
      # transcription answer 503 instead of a connection error, and `auto` picks a
      # cloud key or a registered local Ollama for embeddings.
      APP_SIDECAR_ENABLED: ${APP_SIDECAR_ENABLED:-false}
      APP_EMBEDDINGS_PROVIDER: ${APP_EMBEDDINGS_PROVIDER:-auto}
      # STDIO MCP servers run in the mcp-stdio-runner container (--profile tools;
      # the CLI exports MCP_STDIO_SIDECAR_ENABLED=true). With ",mcp" in
      # LITE_SPRING_PROFILES + CORE_IMAGE_VARIANT=-full they spawn inside core
      # instead, and the container itself is the boundary (no sandbox-exec/bwrap
      # in the image, and cap_drop blocks the unshare fallback) - hence `none`.
      MCP_STDIO_SIDECAR_ENABLED: ${MCP_STDIO_SIDECAR_ENABLED:-false}
      MCP_STDIO_SIDECAR_URL: mcp-stdio-runner:8097
      MCP_STDIO_SIDECAR_SHARED_SECRET: ${MCP_STDIO_SIDECAR_SHARED_SECRET:-}
      APP_MCP_STDIO_SANDBOX: ${APP_MCP_STDIO_SANDBOX:-none}
      # Custom code tools (agent-authored Java/Python/JavaScript programs) compile and run in
      # tool-sandbox, which rides the `tools` profile on this tier. The sandbox container holds no
      # platform secret and sits on sandbox-net, an internal network with no route out.
      TOOL_SANDBOX_ENABLED: ${TOOL_SANDBOX_ENABLED:-false}
      TOOL_SANDBOX_BASE_URL: http://tool-sandbox:8095
      TOOL_SANDBOX_INTERNAL_TOKEN: ${TOOL_SANDBOX_INTERNAL_TOKEN:-}
      # Starter connectors (fetch, time, sequential-thinking) registered for every
      # workspace at start when the runner is on. A deleted or edited one is never
      # put back.
      APP_MCP_STARTER_ENABLED: ${APP_MCP_STARTER_ENABLED:-false}
      # The Assistant surface's features - on for this local single-node tier;
      # set any to false in .env to switch it back off.
      SCHEDULED_TASKS_ENABLED: ${SCHEDULED_TASKS_ENABLED:-true}
      SCHEDULED_TASKS_MAX_PER_TENANT: ${SCHEDULED_TASKS_MAX_PER_TENANT:-25}
      APP_CHAT_BRANCHING_ENABLED: ${APP_CHAT_BRANCHING_ENABLED:-true}
      APP_CHAT_RESUMABLE_STREAMS_ENABLED: ${APP_CHAT_RESUMABLE_STREAMS_ENABLED:-true}
      DATA_TABLES_ENABLED: ${DATA_TABLES_ENABLED:-true}
      APP_SKILLS_LEARNING_ENABLED: ${APP_SKILLS_LEARNING_ENABLED:-true}
      APP_SKILLS_LEARNING_SELF_CHECK_ENABLED: ${APP_SKILLS_LEARNING_SELF_CHECK_ENABLED:-true}
      APP_LEARNING_PROPOSALS_ENABLED: ${APP_LEARNING_PROPOSALS_ENABLED:-true}
      APP_LEARNING_LESSONS_ENABLED: ${APP_LEARNING_LESSONS_ENABLED:-true}
      APP_LEARNING_PREFERENCES_ENABLED: ${APP_LEARNING_PREFERENCES_ENABLED:-true}
      APP_LEARNING_ROUTINES_ENABLED: ${APP_LEARNING_ROUTINES_ENABLED:-true}
      APP_LEARNING_REVIEW_ENABLED: ${APP_LEARNING_REVIEW_ENABLED:-true}
      # Deep research stays opt-in: it needs a search provider (a stored key or
      # the SearXNG add-on from --search).
      RESEARCH_DEEP_ENABLED: ${RESEARCH_DEEP_ENABLED:-false}
      RESEARCH_RUNS_ENABLED: ${RESEARCH_RUNS_ENABLED:-false}
      # The Assistant's projects folder and build terminal (--profile workspace):
      # commands run in the workspace-runner container; files land in the projects
      # folder mounted at /workspace. Off until the operator opts in - on this
      # Keycloak tier the CLI also sets APP_ASSISTANT_LOCAL_SHELL_ENABLED and
      # ..._ACKNOWLEDGE_SHARED_HOST when the profile is chosen.
      APP_ASSISTANT_LOCAL_SHELL_ENABLED: ${APP_ASSISTANT_LOCAL_SHELL_ENABLED:-false}
      APP_ASSISTANT_LOCAL_SHELL_ACKNOWLEDGE_SHARED_HOST: ${APP_ASSISTANT_LOCAL_SHELL_ACKNOWLEDGE_SHARED_HOST:-false}
      APP_ASSISTANT_LOCAL_SHELL_WORKSPACE: /workspace
      APP_ASSISTANT_LOCAL_SHELL_WORKSPACE_HOST_PATH: ${VEGADUTA_PROJECTS_DIR:-}
      APP_ASSISTANT_LOCAL_SHELL_RUNNER_URL: ${APP_ASSISTANT_LOCAL_SHELL_RUNNER_URL:-}
      APP_ASSISTANT_LOCAL_SHELL_RUNNER_SECRET: ${WORKSPACE_RUNNER_SECRET:-}
      APP_ASSISTANT_LOCAL_SHELL_MAX_TIMEOUT_SECONDS: ${WORKSPACE_RUNNER_MAX_TIMEOUT_SECONDS:-1800}
      APP_ASSISTANT_LOCAL_SHELL_APPROVAL_REQUIRED: ${APP_ASSISTANT_LOCAL_SHELL_APPROVAL_REQUIRED:-true}
      # The agent's browser (--browser layers browser.yml, a Playwright container
      # core attaches to; CORE_IMAGE_VARIANT=-full puts Chromium inside core). The
      # flags cost nothing while no browser exists; the domain policy is unchanged.
      BROWSER_V2_ENABLED: ${BROWSER_V2_ENABLED:-true}
      BROWSER_PROFILES_ENABLED: ${BROWSER_PROFILES_ENABLED:-true}
      BROWSER_TAKEOVER_ENABLED: ${BROWSER_TAKEOVER_ENABLED:-true}
      BROWSER_ALLOWED_DOMAINS: ${BROWSER_ALLOWED_DOMAINS:-}
      BROWSER_BLOCKED_DOMAINS: ${BROWSER_BLOCKED_DOMAINS:-}
      # /add-ons on this self-hosted box: tenant admins may switch extras (the
      # registry is install-wide; set false to leave it to the platform admin).
      APP_ADDONS_TENANT_ADMIN_MAY_CHANGE: ${APP_ADDONS_TENANT_ADMIN_MAY_CHANGE:-true}
      APP_ADDONS_HOST_TOKEN: ${ADDONS_HOST_TOKEN:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_URL: ${PUBLIC_LIVEKIT_URL:-ws://localhost:7880}
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      MANAGEMENT_TRACING_ENABLED: "false"
      SPRING_MAIL_HOST: ${SMTP_HOST:-}
      SPRING_MAIL_PORT: ${SMTP_PORT:-587}
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD:-}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${CORE_HOST_PORT:-8080}:8080"
    # `default` is named explicitly because listing any network drops the implicit
    # one; mcp-stdio-net is shared only with the runner (empty without `tools`).
    networks:
      - default
      - mcp-stdio-net
      - sandbox-net
    volumes:
      - core-storage:/data/storage
      - core-mcp-data:/app/mcp-data
      - ../../examples/mcp-servers:/opt/mcp-servers:ro
      # The projects folder the Assistant works in (VEGADUTA_PROJECTS_DIR, set by
      # --profile workspace); an empty named volume otherwise, so nothing of the
      # host is mounted unless asked.
      - ${VEGADUTA_PROJECTS_DIR:-core-projects}:/workspace
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s
    deploy:
      resources:
        limits:
          memory: ${CORE_MEM_LIMIT:-2g}

  web:
    image: ${VEGADUTA_REGISTRY:-ghcr.io/cd-lc}/web:${VEGADUTA_VERSION:?set VEGADUTA_VERSION to a release (e.g. 1.2.3) or use --build; run scripts/vegaduta secrets}
    <<: [*restart, *logging, *hardened]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /app/.next/cache:size=512m,uid=999,gid=999,mode=0700
      - /home/nextjs:size=64m,uid=999,gid=999,mode=0700
    depends_on:
      core:
        condition: service_healthy
        restart: true
    # Runtime NEXT_PUBLIC_* (window.__ENV) with build-time fallback.
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_KEYCLOAK_URL: ${PUBLIC_AUTH_URL:-http://localhost:8180}
      NEXT_PUBLIC_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-agentic-ai}
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: agentic-ai-web
      NEXT_PUBLIC_BILLING_ENABLED: ${WEB_BILLING_ENABLED:-}
      NEXT_PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_CODE_INTEL_URL: ""
      NEXT_PUBLIC_APP_BUILDER_URL: ""
      NEXT_PUBLIC_EDGE_AGENTS: ${WEB_EDGE_AGENTS:-}
      NEXT_PUBLIC_DEPLOY_ENV: ${WEB_DEPLOY_ENV:-lite}
      NEXT_PUBLIC_FREE_MODE: ${WEB_FREE_MODE:-1}
      NEXT_PUBLIC_SITE_MODE: ${WEB_SITE_MODE:-}
      NEXT_PUBLIC_DOCS_URL: ${WEB_DOCS_URL:-}
      NEXT_PUBLIC_COMMERCIAL_URL: ${WEB_COMMERCIAL_URL:-}
      NEXT_PUBLIC_ACADEMY_URL: ${WEB_ACADEMY_URL:-https://academy.vegaduta.ai}
      NEXT_PUBLIC_CONTACT_EMAIL: ${WEB_CONTACT_EMAIL:-}
      NEXT_PUBLIC_MCP_APPS: ${WEB_MCP_APPS:-}
      NEXT_PUBLIC_ARTIFACTS: ${WEB_ARTIFACTS:-}
      NEXT_PUBLIC_TRUSTED_IMAGE_HOSTS: ${WEB_TRUSTED_IMAGE_HOSTS:-}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${WEB_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m

  workspace-perms:
    # One-shot, idempotent: the projects folder is shared by core (uid 999, saves
    # chat uploads in "Chat uploads") and the workspace-runner (uid 1000, writes
    # the build output). Whichever container creates the named volume first owns
    # it, and a volume owned by 1000 refused core's upload - so attaching any file
    # failed. Opened up only for the named volume (VEGADUTA_PROJECTS_DIR unset); a
    # folder the user chose on the host keeps the permissions they gave it.
    image: ${VEGADUTA_REGISTRY:-ghcr.io/cd-lc}/core${CORE_IMAGE_VARIANT:-}:${VEGADUTA_VERSION:?set VEGADUTA_VERSION to a release (e.g. 1.2.3) or use --build; run scripts/vegaduta secrets}
    restart: "no"
    user: "0:0"
    entrypoint: ["sh", "-c", "[ -n \"$$VEGADUTA_PROJECTS_DIR\" ] || chmod 0777 /workspace"]
    environment:
      VEGADUTA_PROJECTS_DIR: ${VEGADUTA_PROJECTS_DIR:-}
    volumes:
      - ${VEGADUTA_PROJECTS_DIR:-core-projects}:/workspace

  # ----------------------------------------------------------- profile: rag
  # Without the profile core runs with app.sidecar.enabled=false (above): the
  # feature reports itself off instead of failing calls against a missing host.
  sidecar:
    image: ${VEGADUTA_REGISTRY:-ghcr.io/cd-lc}/sidecar:${VEGADUTA_VERSION:?set VEGADUTA_VERSION to a release (e.g. 1.2.3) or use --build; run scripts/vegaduta secrets}
    profiles: ["rag"]
    <<: [*restart, *logging, *hardened]
    environment:
      SIDECAR_SHARED_SECRET: ${SIDECAR_SHARED_SECRET:?run scripts/vegaduta secrets}
      SIDECAR_AUTH_REQUIRED: "true"
      RENDER_THREADS: "1"
      RENDER_CALLBACK_ALLOWED_HOSTS: core
    volumes:
      - sidecar-workspace:/app/workspace
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${SIDECAR_MEM_LIMIT:-2g}

  # ---------------------------------------------------------- profile: tools
  # STDIO MCP servers (workspace-registered `npx <pkg>` / `uvx <pkg>` and the
  # starter connectors) run HERE, in their own container, away from core's
  # secrets, database and Valkey. Same service the full stack runs; core reaches
  # it over the mcp-stdio-net network only, through a relay that is part of the
  # core image. No port is published, no volume is mounted (the projects folder
  # is deliberately NOT visible here) and the shared secret is the only
  # credential it knows about.
  mcp-stdio-runner:
    image: ${VEGADUTA_REGISTRY:-ghcr.io/cd-lc}/mcp-stdio-runner:${VEGADUTA_VERSION:?set VEGADUTA_VERSION to a release (e.g. 1.2.3) or use --build; run scripts/vegaduta secrets}
    profiles: ["tools"]
    <<: [*restart, *logging]
    environment:
      MCP_STDIO_SIDECAR_SHARED_SECRET: ${MCP_STDIO_SIDECAR_SHARED_SECRET:?run scripts/vegaduta secrets}
      MCP_STDIO_RUNNER_MAX_CHILDREN: ${MCP_STDIO_RUNNER_MAX_CHILDREN:-8}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8098/health',res=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
      - seccomp:../../services/mcp-stdio-runner/seccomp-profile.json
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          memory: ${MCP_STDIO_RUNNER_MEM_LIMIT:-768m}
          pids: 256
    networks: [mcp-stdio-net]

  # Runs agent-authored custom code tools (Java, Python, JavaScript), verified and compiled inside
  # this container. It holds no platform credential - the whole environment is the internal token
  # and the numeric budgets - and sits on sandbox-net, an internal network shared with core alone,
  # so there is no route to postgres, valkey or the internet from tenant code.
  tool-sandbox:
    image: ${VEGADUTA_REGISTRY:-ghcr.io/cd-lc}/tool-sandbox:${VEGADUTA_VERSION:?set VEGADUTA_VERSION to a release (e.g. 1.2.3) or use --build; run scripts/vegaduta secrets}
    profiles: ["tools"]
    <<: [*restart, *logging]
    environment:
      TOOL_SANDBOX_INTERNAL_TOKEN: ${TOOL_SANDBOX_INTERNAL_TOKEN:?run scripts/vegaduta secrets}
      TOOL_SANDBOX_MAX_CONCURRENT: ${TOOL_SANDBOX_MAX_CONCURRENT:-4}
      TOOL_SANDBOX_MAX_TIMEOUT_MS: ${TOOL_SANDBOX_MAX_TIMEOUT_MS:-15000}
      TOOL_SANDBOX_MAX_MEMORY_MB: ${TOOL_SANDBOX_MAX_MEMORY_MB:-512}
      TOOL_SANDBOX_REQUIRE_PRIVILEGE_DROP: "true"
      TOOL_SANDBOX_SECCOMP: ${TOOL_SANDBOX_SECCOMP:-false}
    # runc shares the host kernel with tenant code. Install gVisor and set
    # TOOL_SANDBOX_RUNTIME=runsc for a user-space kernel (doctor warns on runc).
    runtime: ${TOOL_SANDBOX_RUNTIME:-runc}
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, KILL]
    tmpfs:
      - /var/sandbox/work:mode=711,uid=0,gid=0,noexec,nosuid,nodev,size=256m
      - /var/sandbox/cache:mode=755,uid=0,gid=0,noexec,nosuid,nodev,size=256m
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8095/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${TOOL_SANDBOX_MEM_LIMIT:-1g}
          pids: 512
    networks: [sandbox-net]

  # ------------------------------------------------------- profile: workspace
  # The Assistant's build terminal (services/workspace-runner): runs the
  # commands the user approves, in the folder they attached, with JDK 21, Maven,
  # Node and git. Only the projects folder is mounted; it holds no platform
  # secret and no Docker socket.
  workspace-runner:
    image: ${VEGADUTA_REGISTRY:-ghcr.io/cd-lc}/workspace-runner:${VEGADUTA_VERSION:?set VEGADUTA_VERSION to a release (e.g. 1.2.3) or use --build; run scripts/vegaduta secrets}
    profiles: ["workspace"]
    <<: [*restart, *logging, *hardened]
    environment:
      WORKSPACE_RUNNER_SECRET: ${WORKSPACE_RUNNER_SECRET:?run scripts/vegaduta secrets}
      WORKSPACE_RUNNER_MAX_TIMEOUT_SECONDS: ${WORKSPACE_RUNNER_MAX_TIMEOUT_SECONDS:-1800}
    # Dev servers the Assistant starts (local_shell background:true) listen on
    # one of these ports; published on this machine's loopback only, so the
    # console's Preview pane can show them.
    ports:
      - "127.0.0.1:13210-13219:13210-13219"
    volumes:
      - ${VEGADUTA_PROJECTS_DIR:-core-projects}:/workspace
      # ~/.m2, ~/.gradle and ~/.npm caches survive restarts and stay out of the projects.
      - workspace-runner-home:/home/runner
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8090/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${WORKSPACE_RUNNER_MEM_LIMIT:-3g}
          # Processes and threads together (every thread is a pid): a JVM or Gradle build uses a few
          # hundred, so this is far above a real build and only stops a runaway command.
          pids: ${WORKSPACE_RUNNER_PIDS_LIMIT:-2048}

  # ----------------------------------------------------------- profile: voice
  # Self-hosted voice calling for the small multi-user tier: the same livekit +
  # voice-agent pair docker-compose.yml's `voice` profile runs, sized for a
  # laptop VM. The console's call button fetches its token from core (the
  # LIVEKIT_* wiring above is already in place); without these services that
  # token leads nowhere. `--profile voice` implies `rag` - the voice-agent
  # transcribes through the sidecar's Whisper endpoint, and the launcher's
  # resolve_profiles adds it.
  livekit:
    image: livekit/livekit-server:v1.13.10
    profiles: ["voice"]
    <<: [*restart, *logging, *nnp]
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?run scripts/vegaduta secrets}: ${LIVEKIT_API_SECRET:?run scripts/vegaduta secrets}"
      LIVEKIT_RTC_PORT_RANGE_START: ${LIVEKIT_RTC_PORT_RANGE_START:-50000}
      LIVEKIT_RTC_PORT_RANGE_END: ${LIVEKIT_RTC_PORT_RANGE_END:-50100}
    volumes:
      - ../livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "${LIVEKIT_BIND_ADDR:-127.0.0.1}:7880:7880"
      - "${LIVEKIT_BIND_ADDR:-127.0.0.1}:7881:7881"
      - "${LIVEKIT_BIND_ADDR:-127.0.0.1}:${LIVEKIT_RTC_PORT_RANGE_START:-50000}-${LIVEKIT_RTC_PORT_RANGE_END:-50100}:${LIVEKIT_RTC_PORT_RANGE_START:-50000}-${LIVEKIT_RTC_PORT_RANGE_END:-50100}/udp"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7880/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: ${LIVEKIT_MEM_LIMIT:-512m}

  voice-agent:
    # LiveKit Agents worker: STT -> core chat -> TTS. Outbound-only.
    image: ${VEGADUTA_REGISTRY:-ghcr.io/cd-lc}/voice-agent:${VEGADUTA_VERSION:?set VEGADUTA_VERSION to a release (e.g. 1.2.3) or use --build; run scripts/vegaduta secrets}
    profiles: ["voice"]
    <<: [*restart, *logging, *hardened]
    depends_on:
      livekit:
        condition: service_healthy
      core:
        condition: service_healthy
      sidecar:
        condition: service_started
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?run scripts/vegaduta secrets}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?run scripts/vegaduta secrets}
      LIVEKIT_URL: ws://livekit:7880
      CORE_API_BASE_URL: http://core:8080
      SIDECAR_BASE_URL: http://sidecar:8001
      SIDECAR_SHARED_SECRET: ${SIDECAR_SHARED_SECRET:?run scripts/vegaduta secrets}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-21m00Tcm4TlvDq8ikWAM}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      VOICE_AGENT_TTS_PROVIDER: ${VOICE_AGENT_TTS_PROVIDER:-auto}
      PERCEPTION_MAX_ROOMS: ${PERCEPTION_MAX_ROOMS:-4}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1', 8081), 3)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${VOICE_AGENT_MEM_LIMIT:-1g}

volumes:
  postgres-data:
  valkey-data:
  keycloak-data:
  core-storage:
  core-mcp-data:
  core-projects:
  workspace-runner-home:
  sidecar-workspace:

# Compose's default "<project>_default" for everything, plus mcp-stdio-net: only
# core and the mcp-stdio-runner are on it, so a package running there has no
# route to postgres or valkey.
networks:
  mcp-stdio-net: {}
  sandbox-net:
    internal: true   # core <-> tool-sandbox only; tenant code has no egress
