# Free, private, local inference: no API key, no cloud account.
#
# Added automatically by `scripts/vegaduta up --local-ai[=host]`. Do not
# layer it by hand unless you also pass `--profile local-ai` (container mode).
#
# Two modes, same result (the platform pool - what FREE tenants use - points
# at an Ollama and core registers it at startup; see docs/local-models.md):
#
#   container (default)  An `ollama` service in this stack; the model is pulled
#                        on first start and kept in the `ollama-data` volume.
#                        CPU only on Docker Desktop for Mac/Windows (containers
#                        cannot reach the Apple GPU); NVIDIA GPUs are picked up
#                        on Linux via docker-compose.local-ai.nvidia.yml.
#   host                 Use an Ollama already running on this machine (the
#                        best choice on Apple Silicon: native Metal speed).
#                        Needs docker-compose.local-ai.host.yml.
#
# Security: Ollama has no authentication, so it publishes NO host port and only
# joins the network core is on. Core may call it only because its exact
# host:port is added to the outbound allow-list below (SsrfGuard otherwise
# refuses every private address).
services:
  ollama:
    profiles: [local-ai]
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.5}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/bin/bash", "-c"]
    # Serve, wait until the API answers, pull the model (a no-op once cached),
    # then stay in the foreground. The healthcheck turns green only when the
    # model is usable, so `up --wait` blocks until chat will actually work.
    command:
      - |
        ollama serve &
        pid=$$!
        until ollama list >/dev/null 2>&1; do sleep 1; done
        # A dropped connection must not leave the container up but never healthy (the install would
        # wait out its whole timeout): retry, then exit so the restart policy starts over (pulls resume).
        n=0
        until ollama pull "$$LOCAL_LLM_MODEL"; do
          n=$$((n + 1))
          if [ "$$n" -ge 5 ]; then echo "model download failed $$n times - restarting" >&2; kill $$pid; exit 1; fi
          echo "model download failed - retrying in $$((n * 15))s" >&2; sleep $$((n * 15))
        done
        # Load the model into memory now (an empty prompt only loads it) so the first reply does not pay
        # the cold start; OLLAMA_KEEP_ALIVE below keeps it there. In the background: health stays tied
        # to the pull, not to the load.
        ( ollama run "$$LOCAL_LLM_MODEL" "" >/dev/null 2>&1 || true ) &
        wait $$pid
    environment:
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen3.5:4b}
      # -1 = never unload: a model that is dropped after idling costs a long cold start on the next reply.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
      # The context window is what grows the model's memory beyond its weights; the launcher lowers it on
      # machines where Docker has little memory (empty = 32768, the agent default).
      OLLAMA_CONTEXT_LENGTH: ${LOCAL_LLM_NUM_CTX:-32768}
    volumes:
      - ollama-data:/root/.ollama
    mem_limit: ${OLLAMA_MEM_LIMIT:-8g}
    healthcheck:
      test: ["CMD-SHELL", "ollama show \"$$LOCAL_LLM_MODEL\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 360       # first start downloads the model (~3 GB for the default)
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  core:
    environment:
      APP_LOCAL_LLM_BOOTSTRAP_ENABLED: "true"
      APP_LOCAL_LLM_BOOTSTRAP_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://ollama:11434}
      APP_LOCAL_LLM_BOOTSTRAP_MODEL: ${LOCAL_LLM_MODEL:-qwen3.5:4b}
      APP_LOCAL_MODELS_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
      APP_LLM_OLLAMA_NUM_CTX: ${LOCAL_LLM_NUM_CTX:-32768}
      # Skip the hidden thinking pass of reasoning models: on a laptop it is most of the wait. Blank = the model's own default.
      APP_LLM_OLLAMA_REASONING_EFFORT: ${LOCAL_LLM_REASONING_EFFORT:-none}
      # Exactly the local model server, plus whatever the operator already allows.
      APP_SECURITY_OUTBOUND_ALLOWED_PRIVATE_HOSTS: ${LOCAL_LLM_ALLOWED_HOST:-ollama:11434}${APP_SECURITY_OUTBOUND_ALLOWED_PRIVATE_HOSTS:+,${APP_SECURITY_OUTBOUND_ALLOWED_PRIVATE_HOSTS}}

volumes:
  ollama-data:
