# web - VegaDuta web console (web/Dockerfile, Next.js standalone on :3000).
# Public config (NEXT_PUBLIC_*) is computed from `global` and passed as runtime env;
# the app reads it per request (web/docs/RUNTIME-CONFIG.md). Override keys via `env`.

global: {}

nameOverride: ""
fullnameOverride: ""
component: frontend

image:
  registry: ""
  repository: web
  tag: ""
  digest: ""
  pullPolicy: ""

replicaCount: 2
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
terminationGracePeriodSeconds: 30
revisionHistoryLimit: 5
containerPort: 3000

service:
  enabled: true
  type: ClusterIP
  port: 3000

serviceAccount:
  create: true
  name: ""
  annotations: {}

probes:
  startup:
    httpGet: { path: /, port: http }
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 30
  liveness:
    httpGet: { path: /, port: http }
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 5
  readiness:
    httpGet: { path: /, port: http }
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
lifecycle:
  preStop:
    exec: { command: ["sleep", "10"] }

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { memory: 768Mi }

# `nextjs` system user in web/Dockerfile.
podSecurityContext:
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 999
securityContext: {}
emptyDirs:
  - { name: tmp, mountPath: /tmp, sizeLimit: 256Mi }
  - { name: next-cache, mountPath: /app/.next/cache, sizeLimit: 512Mi }
  - { name: home, mountPath: /home/nextjs, sizeLimit: 64Mi }

hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 75
pdb:
  enabled: true
topologySpread:
  enabled: true

# -- Public host <global.hosts.app>.<global.domain>; add the apex via extraHosts if wanted.
ingress:
  enabled: true
  hostKey: app
  # -- Additional global.hosts.* keys whose hosts this ingress also serves
  #   (the umbrella sets ["admin"] so the merged platform-admin console keeps
  #   its old admin.<domain> host; see PLATFORM_ADMIN_HOST in deployment.yaml).
  extraHostKeys: []
  extraHosts: []
  annotations: {}

serviceMonitor:
  enabled: false

networkPolicy:
  allowFrom: []
  allowEgressTo: [core]
  allowExternalEgress: false
  extraIngress: []
  extraEgress: []

tests:
  enabled: true
  path: /

env:
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: "1"
  HOME: /home/nextjs
  npm_config_cache: /tmp/.npm
  # "1" shows plans/prices/upgrade/billing UI (hosted SaaS). "" = off (self-hosted default).
  NEXT_PUBLIC_BILLING_ENABLED: ""
  # Signed-out pages: "oss" = technical open-source pages, no commercial content
  # (default); "classic" = the original marketing pages.
  NEXT_PUBLIC_SITE_MODE: "oss"
  # Absolute URL of the published documentation site; "" = in-app help at /docs.
  NEXT_PUBLIC_DOCS_URL: ""
  # Absolute URL of a hosted/commercial offering; "" = the OSS pages show no such link.
  NEXT_PUBLIC_COMMERCIAL_URL: ""
  # Absolute URL of the Academy (a separate, proprietary deployable); defaults
  # to the hosted academy.vegaduta.ai. Set your own Academy origin, or "" to
  # hide the links on a fork.
  NEXT_PUBLIC_ACADEMY_URL: "https://academy.vegaduta.ai"
  # Contact address shown on /plugins and /account-deletion; "" = built-in placeholder.
  # Set it to an address you own.
  NEXT_PUBLIC_CONTACT_EMAIL: ""
secretEnv: []
extraEnv: []
envFrom: []
extraVolumes: []
extraVolumeMounts: []
podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
imagePullSecrets: []
