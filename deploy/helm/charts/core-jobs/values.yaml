# core-jobs - background jobs (core/Dockerfile with MODULE=app-jobs). No REST
# controllers; the HTTP port serves actuator health/metrics only. While it runs,
# the API gets the `shape-api` profile and skips every job this pod owns
# (driven by global.components.coreJobs - keep them consistent by using only that switch).
# Shares database, Valkey, S3, OIDC and the APP_ENCRYPTION_KEY Secret with core via `global`.

global: {}

nameOverride: ""
fullnameOverride: ""
component: jobs

image:
  registry: ""
  # -- core/Dockerfile built with --build-arg MODULE=app-jobs. Tag must match the core API image.
  repository: core-jobs
  tag: ""
  digest: ""
  pullPolicy: ""

# -- Optional per-chart override; must equal global.core.appSecret.existingSecret when both are set.
appSecret:
  existingSecret: ""

# -- Exactly 1. More replicas only with leaderElection=true (sweeps hold PgAdvisoryJobLock, but not every job is proven safe twice).
replicaCount: 1
# -- Set true only after verifying every scheduled job is advisory-locked (see docs/deploy/DEPLOYMENT-SHAPES.md).
leaderElection: false
strategy:
  type: Recreate
terminationGracePeriodSeconds: 90
revisionHistoryLimit: 5
containerPort: 8080

service:
  enabled: true
  type: ClusterIP
  port: 8080

serviceAccount:
  create: true
  name: ""
  annotations: {}

javaToolOptions: "-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError"
# -- Hikari overrides (default max 10, timeout 30 s).
hikari: {}

probes:
  startup:
    httpGet: { path: /actuator/health/readiness, port: http }
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
  # Liveness only has to catch a JVM that is really stuck, so it tolerates load: a busy pod (CPU saturation, long GC)
  # answers late, and killing it makes the overload worse. 10 s timeout x 12 failures at a 10 s period = about 2
  # minutes of continuous silence before a restart. Readiness stays quick so a busy pod leaves rotation first.
  # deploy/helm/test-guards.sh fails if these regress.
  liveness:
    httpGet: { path: /actuator/health/liveness, port: http }
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 12
  readiness:
    httpGet: { path: /actuator/health/readiness, port: http }
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

resources:
  requests: { cpu: 250m, memory: 1Gi }
  limits: { memory: 2Gi }

podSecurityContext:
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 999
securityContext: {}
emptyDirs:
  - { name: tmp, mountPath: /tmp, sizeLimit: 1Gi }
  - { name: mcp-data, mountPath: /app/mcp-data, sizeLimit: 1Gi }
  - { name: npm-cache, mountPath: /home/agentic/.npm, sizeLimit: 1Gi }
  - { name: uv-cache, mountPath: /home/agentic/.cache/uv, sizeLimit: 1Gi }
  - { name: vegaduta-home, mountPath: /home/agentic/.vegaduta, sizeLimit: 1Gi }

hpa:
  enabled: false
pdb:
  enabled: true
topologySpread:
  enabled: false

ingress:
  enabled: false

serviceMonitor:
  path: /actuator/prometheus
  interval: 30s

networkPolicy:
  allowFrom: []
  allowEgressTo: [postgres, valkey, keycloak, seaweedfs, core, sidecar, code-intel, tool-sandbox, mcp-stdio-runner]
  allowExternalEgress: true
  externalEgressPorts: [443]
  # -- Ports of the configured integrations (see core's values).
  integrationEgress: true
  extraIngress: []
  extraEgress: []

tests:
  enabled: true
  path: /actuator/health/readiness

env: {}
secretEnv: []
extraEnv: []
envFrom: []
extraVolumes: []
extraVolumeMounts: []
podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
imagePullSecrets: []

# -- Argo CD sync wave of the Deployment: after the migrate Job (wave 0).
argocd:
  syncWave: "1"
