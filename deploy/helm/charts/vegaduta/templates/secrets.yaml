{{- /* Generated shared Secrets. `helm.sh/resource-policy: keep`: helm uninstall never
  deletes them (losing APP_ENCRYPTION_KEY makes every stored credential unreadable).
  Values are reused across upgrades via lookup. helm template / Argo CD / Flux cannot
  lookup, so those renders FAIL here unless existingSecret is set (or
  global.allowGeneratedSecrets=true for throwaway renders): see
  vegaduta-lib.requirePersistableSecret. Argo CD sync-wave -2: Secrets before the
  database (-1) and the workloads (0). */ -}}
{{- $g := .Values.global -}}
{{- if not $g.core.appSecret.existingSecret }}
{{- $name := include "vegaduta-lib.componentName" (dict "root" . "name" "core-app") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vegaduta-lib.labels" . | nindent 4 }}
  annotations:
    {{- include "vegaduta-lib.keepAnnotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "-2"
type: Opaque
data:
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
  {{- if and $existing $existing.data $existing.data.APP_ENCRYPTION_KEY }}
  APP_ENCRYPTION_KEY: {{ $existing.data.APP_ENCRYPTION_KEY }}
  {{- else }}
  {{- include "vegaduta-lib.requirePersistableSecret" (dict "root" . "secret" $name "hint" "Create a Secret with key APP_ENCRYPTION_KEY (openssl rand -base64 32) and set global.core.appSecret.existingSecret.") }}
  {{- if and .Release.IsUpgrade (not $g.allowGeneratedSecrets) }}
  {{- fail (printf "Secret %s (APP_ENCRYPTION_KEY) is missing during an upgrade. Generating a new key would make every stored credential undecryptable. Restore the Secret from your backup (or set global.core.appSecret.existingSecret); only if the database holds no encrypted data, re-run with global.allowGeneratedSecrets=true." $name) }}
  {{- end }}
  {{- /* base64 of 32 random BYTES (256 bits), as EncryptionService requires (AES-256);
    randBytes already returns the base64 form, the outer b64enc is the Secret `data` encoding. */}}
  APP_ENCRYPTION_KEY: {{ randBytes 32 | b64enc }}
  {{- end }}
{{- end }}
{{- if not $g.internalSecret.existingSecret }}
{{- $name := include "vegaduta-lib.componentName" (dict "root" . "name" "internal") }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vegaduta-lib.labels" . | nindent 4 }}
  annotations:
    {{- include "vegaduta-lib.keepAnnotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "-2"
type: Opaque
stringData:
  {{- range (list "SIDECAR_SHARED_SECRET" "MCP_STDIO_SIDECAR_SHARED_SECRET" "CODE_INTEL_INTERNAL_TOKEN" "TOOL_SANDBOX_INTERNAL_TOKEN" "APP_BUILDER_CORE_SERVICE_TOKEN" "RL_TRAINER_INTERNAL_TOKEN") }}
  {{ . }}: {{ include "vegaduta-lib.stableRandom" (dict "root" $ "secret" $name "key" . "length" 48) | quote }}
  {{- end }}
  {{- /* Fernet key: url-safe base64 of 32 bytes. */}}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
  {{- if and $existing $existing.data $existing.data.APP_BUILDER_ENCRYPTION_KEY }}
  APP_BUILDER_ENCRYPTION_KEY: {{ $existing.data.APP_BUILDER_ENCRYPTION_KEY | b64dec | quote }}
  {{- else }}
  {{- include "vegaduta-lib.requirePersistableSecret" (dict "root" $ "secret" $name "hint" "Create the internal Secret (keys listed in the umbrella values) and set global.internalSecret.existingSecret.") }}
  APP_BUILDER_ENCRYPTION_KEY: {{ randBytes 32 | replace "+" "-" | replace "/" "_" | quote }}
  {{- end }}
{{- end }}
