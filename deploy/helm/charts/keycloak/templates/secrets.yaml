{{- $name := include "vegaduta-lib.fullname" . -}}
{{- if not .Values.admin.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-admin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vegaduta-lib.labels" . | nindent 4 }}
  annotations:
    {{- include "vegaduta-lib.keepAnnotations" . | nindent 4 }}
type: Opaque
stringData:
  username: admin
  password: {{ include "vegaduta-lib.stableRandom" (dict "root" . "secret" (printf "%s-admin" $name) "key" "password" "length" 24) | quote }}
{{- end }}
{{- /* The core client secret: read by Keycloak (realm import + reconcile) and by core. */}}
{{- $o := (.Values.global | default dict).oidc | default dict }}
{{- if not $o.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-core-client
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vegaduta-lib.labels" . | nindent 4 }}
  annotations:
    {{- include "vegaduta-lib.keepAnnotations" . | nindent 4 }}
type: Opaque
stringData:
  clientSecret: {{ include "vegaduta-lib.stableRandom" (dict "root" . "secret" (printf "%s-core-client" $name) "key" "clientSecret" "length" 40) | quote }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-realm
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vegaduta-lib.labels" . | nindent 4 }}
data:
  {{ include "vegaduta-lib.oidc.realm" . }}-realm.json: |
    {{- include "keycloak.realmJson" . | nindent 4 }}
