{{- $name := include "vegaduta-lib.fullname" . -}}
{{- $p := .Values.persistence -}}
{{- $sc := $p.storageClass | default (.Values.global | default dict).storageClass -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vegaduta-lib.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ $name }}
  selector:
    matchLabels:
      {{- include "vegaduta-lib.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/model: {{ .Values.model | sha256sum | trunc 16 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "vegaduta-lib.labels" . | nindent 8 }}
    spec:
      {{- $v := deepCopy .Values -}}
      {{- $_ := set $v "persistence" (dict "enabled" false) -}}
      {{- $_ := set $v "topologySpread" (dict "enabled" false) -}}
      {{- if $p.enabled }}
      {{- $_ := set $v "extraVolumeMounts" (list (dict "name" "data" "mountPath" "/data")) -}}
      {{- else }}
      {{- $_ := set $v "emptyDirs" (append $v.emptyDirs (dict "name" "data" "mountPath" "/data" "sizeLimit" "10Gi")) -}}
      {{- end }}
      {{- $ctx := dict "Values" $v "Chart" .Chart "Release" .Release "Capabilities" .Capabilities "Template" .Template -}}
      {{- $env := merge (dict "LOCAL_LLM_MODEL" .Values.model) (deepCopy (.Values.env | default dict)) -}}
      {{- $script := "ollama serve &\npid=$!\nuntil ollama list >/dev/null 2>&1; do sleep 1; done\nollama pull \"$LOCAL_LLM_MODEL\"\nwait $pid\n" -}}
      {{- include "vegaduta-lib.podSpec" (dict "root" $ctx "env" $env "command" (list "/bin/bash" "-c") "args" (list $script)) | nindent 6 }}
  {{- if $p.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "vegaduta-lib.selectorLabels" . | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if $sc }}
        storageClassName: {{ $sc | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $p.size | quote }}
  {{- end }}
