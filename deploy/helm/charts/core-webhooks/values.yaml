# core-webhooks - the webhooks POOL of the jobs shape. It is the core-jobs image (core/Dockerfile with
# MODULE=app-jobs) started with the `shape-jobs-pool` profile and APP_SCHEDULING_POOL=webhooks, so it runs ONLY
# outbound webhook delivery and the workflow event outbox. The main core-jobs Deployment then leaves those jobs to
# this one (APP_SCHEDULING_OFFLOADED_POOLS). Pools split which pod runs a job, never what runs
# (JobsPoolsCoverEveryJobTest, for every combination of pools). Switch: global.components.coreWebhooks (needs coreJobs).
# No REST controllers; the HTTP port serves actuator health/metrics only.
# Shares database, Valkey, S3, OIDC and the APP_ENCRYPTION_KEY Secret with core via `global`.
#
# Design: docs/architecture/ADR-0014-horizontal-scaling.md. Honest limit: every job here is advisory-locked,
# so more replicas add failover, not parallelism.

global: {}

nameOverride: ""
fullnameOverride: ""
component: webhooks
# -- Selects the pool profile, APP_SCHEDULING_POOL and the smaller DB pool in vegaduta-lib. Do not change.
pool: webhooks

image:
  registry: ""
  # -- The core-jobs image (core/Dockerfile built with --build-arg MODULE=app-jobs). Tag must match the core API image.
  repository: core-jobs
  tag: ""
  digest: ""
  pullPolicy: ""

# -- Optional per-chart override; must equal global.core.appSecret.existingSecret when both are set.
appSecret:
  existingSecret: ""

# -- 1. More replicas only with leaderElection=true, and they add failover only: every job here holds a
# Postgres advisory lock, so one pod works at a time.
replicaCount: 1
# -- Set true to run more than one replica for failover (every job here is advisory-locked).
leaderElection: false
strategy:
  type: Recreate
terminationGracePeriodSeconds: 90
revisionHistoryLimit: 5
containerPort: 8080

service:
  enabled: true
  type: ClusterIP
  port: 8080

serviceAccount:
  create: true
  name: ""
  annotations: {}

javaToolOptions: "-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError"
# -- Hikari overrides (default max 6, timeout 30 s): two locked jobs run concurrently on the 8-thread scheduler and each can pin up to 2 connections (PgAdvisoryJobLock), so keep headroom above 4.
hikari: {}

probes:
  startup:
    httpGet: { path: /actuator/health/readiness, port: http }
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
  # Liveness only has to catch a JVM that is really stuck, so it tolerates load: a busy pod (CPU saturation, long GC)
  # answers late, and killing it makes the overload worse. 10 s timeout x 12 failures at a 10 s period = about 2
  # minutes of continuous silence before a restart. Readiness stays quick so a busy pod leaves rotation first.
  # deploy/helm/test-guards.sh fails if these regress.
  liveness:
    httpGet: { path: /actuator/health/liveness, port: http }
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 12
  readiness:
    httpGet: { path: /actuator/health/readiness, port: http }
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

resources:
  # Delivery mostly waits on customer endpoints: sized for a full core context, not for large payloads. Estimated, not measured.
  requests: { cpu: 250m, memory: 768Mi }
  limits: { memory: 1536Mi }

podSecurityContext:
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 999
securityContext: {}
emptyDirs:
  - { name: tmp, mountPath: /tmp, sizeLimit: 1Gi }
  - { name: mcp-data, mountPath: /app/mcp-data, sizeLimit: 1Gi }
  - { name: npm-cache, mountPath: /home/agentic/.npm, sizeLimit: 1Gi }
  - { name: uv-cache, mountPath: /home/agentic/.cache/uv, sizeLimit: 1Gi }

hpa:
  enabled: false
pdb:
  enabled: true
topologySpread:
  enabled: false

ingress:
  enabled: false

serviceMonitor:
  path: /actuator/prometheus
  interval: 30s

networkPolicy:
  allowFrom: []
  # -- Trimmed on purpose (review F9): this pool runs no agent turn (webhook delivery to customer endpoints (external 443) and the workflow event outbox relay to Kafka (integrationEgress)), so it gets no egress to sidecar, code-intel or
  # tool-sandbox. mcp-stdio-runner stays: every core-family pod reconnects the enabled MCP servers at boot
  # (DynamicMcpConnectionManager.reconnectEnabledOnStartup) and writes their connection status, so a blocked
  # runner would flip tenants' stdio servers to ERROR. See the chart README.
  allowEgressTo: [postgres, valkey, keycloak, seaweedfs, core, mcp-stdio-runner]
  allowExternalEgress: true
  externalEgressPorts: [443]
  # -- Ports of the configured integrations (see core's values).
  integrationEgress: true
  extraIngress: []
  extraEgress: []

tests:
  enabled: true
  path: /actuator/health/readiness

env: {}
secretEnv: []
extraEnv: []
envFrom: []
extraVolumes: []
extraVolumeMounts: []
podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
imagePullSecrets: []

# -- Argo CD sync wave of the Deployment: after the migrate Job (wave 0).
argocd:
  syncWave: "1"
