# Example helmfile (https://github.com/helmfile/helmfile): cluster prerequisites + VegaDuta
# in one `helmfile apply`. Generic example - adjust versions, domain and values to your cluster.
#   DOMAIN=example.com ACME_EMAIL=ops@example.com helmfile -f deploy/helm/examples/helmfile.yaml apply
repositories:
  - name: ingress-nginx
    url: https://kubernetes.github.io/ingress-nginx
  - name: jetstack
    url: https://charts.jetstack.io
  - name: cnpg
    url: https://cloudnative-pg.github.io/charts

releases:
  - name: ingress-nginx
    namespace: ingress-nginx
    chart: ingress-nginx/ingress-nginx
    version: 4.13.9

  - name: cert-manager
    namespace: cert-manager
    chart: jetstack/cert-manager
    version: v1.20.4
    values:
      - crds: { enabled: true }

  - name: cnpg
    namespace: cnpg-system
    chart: cnpg/cloudnative-pg
    version: 0.29.1

  - name: vegaduta
    namespace: vegaduta
    chart: oci://ghcr.io/cd-lc/charts/vegaduta
    version: 0.2.0
    needs: [ingress-nginx/ingress-nginx, cert-manager/cert-manager, cnpg-system/cnpg]
    values:
      - global:
          domain: {{ requiredEnv "DOMAIN" | quote }}
          tls:
            clusterIssuer: letsencrypt-prod
          networkPolicy:
            enabled: true
    # A ClusterIssuer "letsencrypt-prod" (ACME HTTP-01 via ingress-nginx, email $ACME_EMAIL) must exist;
    # create it once with kubectl or add a small local chart here.
