# Free local model on the kind stage using the Ollama on the HOST machine (no in-cluster pod).
# Costs the 16 GB Docker VM no memory and uses the host GPU (Apple Silicon: Metal).
#
#   ollama pull llama3.2:3b          # or any tag; set the same one below
#   helm upgrade vegaduta deploy/helm/charts/vegaduta -n vegaduta --reuse-values \
#     -f ~/vegaduta-values-kind-memory.yaml -f deploy/kind/values-kind-ollama-host.yaml
#
# Pods reach the host as host.docker.internal (Docker Desktop). The host Ollama may stay on
# 127.0.0.1; it needs no OLLAMA_HOST change on Docker Desktop. Core only registers the pool row
# when none with this label/base URL exists: to change the model later, edit the row in
# Platform Admin -> LLM providers (or delete it and restart core).
ollama:
  enabled: false
core:
  env:
    APP_LOCAL_LLM_BOOTSTRAP_ENABLED: "true"
    APP_LOCAL_LLM_BOOTSTRAP_BASE_URL: http://host.docker.internal:11434
    APP_LOCAL_LLM_BOOTSTRAP_MODEL: llama3.2:3b
    # Keep the mock-llm entry the stage already allows.
    APP_SECURITY_OUTBOUND_ALLOWED_PRIVATE_HOSTS: mock-llm:11434,host.docker.internal:11434
