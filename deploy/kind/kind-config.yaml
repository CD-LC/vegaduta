# Local evaluation cluster for VegaDuta (https://kind.sigs.k8s.io).
#   kind create cluster --name vegaduta --config deploy/kind/kind-config.yaml
# Ports 80/443 on the host go to ingress-nginx (installed with its "kind" provider manifest),
# so http://app.127.0.0.1.nip.io etc. work from the host browser.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: vegaduta
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
