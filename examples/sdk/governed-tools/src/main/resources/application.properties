# Model: any Spring AI starter works. Ollama needs no key: `ollama pull llama3.2` first.
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2

# Governance. STRICT denies tools that carry no @Governed classification.
vegaduta.agent.mode=strict
vegaduta.agent.approval.required-from=high
vegaduta.agent.budget.max-tool-calls-per-run=10

# Approvals, effects and audit in H2 (switch the URL to PostgreSQL for a real deployment).
spring.datasource.url=jdbc:h2:mem:governed;DB_CLOSE_DELAY=-1
vegaduta.agent.store.type=jdbc
vegaduta.agent.store.initialize-schema=true

# Reviewers decide through these endpoints. Put them behind Spring Security in production.
vegaduta.agent.approval.endpoint.enabled=true

logging.level.io.vegaduta.agent.audit=INFO
